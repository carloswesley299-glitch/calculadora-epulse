<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>E-Pulse · App do Vendedor</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --y:#FFD600;--y2:#FFC400;--ydim:rgba(255,214,0,0.12);
  --org:#FF7A00;--org2:#FF9500;
  --bg:#F5F4F0;--white:#FFFFFF;--surface:#EEECE8;--card:#FFFFFF;
  --border:#DDDBD5;--border2:#C8C5BD;
  --text:#1A1915;--text2:#4A4840;--muted:#8A887E;
  --red:#E53E3E;--redl:rgba(229,62,62,0.1);
  --green:#1E9E50;--greenl:rgba(30,158,80,0.1);
  --orange:#E07B1A;--orangel:rgba(224,123,26,0.1);
  --blue:#2B7FE8;--bluel:rgba(43,127,232,0.1);
  --purple:#7B55D4;--purplel:rgba(123,85,212,0.1);
  --fs:1; --fn:'Nunito',sans-serif;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--fn);min-height:100vh;overflow-x:hidden;}
body{font-size:calc(14px * var(--fs));}
@media(max-width:480px){body{font-size:calc(13px * var(--fs));}}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:var(--surface);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
::-webkit-scrollbar-thumb:hover{background:var(--y2);}

#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:14px;transition:opacity .4s;}
#loading.hide{opacity:0;pointer-events:none;}
.spin{width:36px;height:36px;border:3px solid var(--border2);border-top-color:var(--y2);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.load-brand{font-size:1.3em;font-weight:900;color:var(--y2);letter-spacing:2px;}
.load-txt{font-size:0.7em;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:2px;}

/* HEADER */
.app-header{
  background:linear-gradient(135deg,#0C0A04 0%,#221900 40%,#3D1E00 70%,#4A2200 100%);
  border-bottom:2px solid rgba(255,180,0,0.3);
  position:sticky;top:0;z-index:100;
  box-shadow:0 2px 20px rgba(255,100,0,0.18);
}
.header-inner{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:11px 16px;gap:10px;flex-wrap:wrap;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-badge{width:34px;height:34px;border-radius:8px;flex-shrink:0;background:linear-gradient(135deg,#FFD600,#FF7A00);display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 2px 8px rgba(255,120,0,0.4);}
.logo-text .brand{font-size:0.8em;font-weight:900;letter-spacing:2px;text-transform:uppercase;background:linear-gradient(90deg,#FFD600,#FF9500);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.1;}
.logo-text .sub{font-size:0.64em;color:rgba(255,180,0,0.45);font-weight:600;}
.header-right{display:flex;align-items:center;gap:7px;}
.fs-wrap{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,200,0,0.2);border-radius:8px;padding:3px 5px;}
.fs-btn{width:24px;height:24px;border-radius:5px;border:none;cursor:pointer;background:transparent;color:rgba(255,200,0,0.65);font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center;transition:all .15s;user-select:none;}
.fs-btn:hover{color:var(--y);background:rgba(255,200,0,0.1);}
.fs-lbl{font-size:0.67em;font-weight:700;color:rgba(255,200,0,0.6);min-width:30px;text-align:center;}
.sync-badge{display:flex;align-items:center;gap:5px;padding:5px 9px;border-radius:7px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,200,0,0.15);font-size:0.68em;font-weight:700;color:rgba(255,200,0,0.55);}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .3s;}
.sync-dot.ok{background:var(--green);box-shadow:0 0 5px var(--green);}
.sync-dot.saving{background:var(--y);animation:sblink .5s infinite;}
.sync-dot.err{background:var(--red);}
@keyframes sblink{0%,100%{opacity:1;}50%{opacity:.25;}}

/* NAV */
.nav-tabs{background:var(--white);border-bottom:2px solid var(--border);position:sticky;top:58px;z-index:90;}
.nav-inner{max-width:960px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none;}
.nav-inner::-webkit-scrollbar{display:none;}
.nav-tab{flex-shrink:0;padding:12px 15px;font-size:0.77em;font-weight:700;color:var(--muted);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .18s;white-space:nowrap;font-family:var(--fn);}
.nav-tab:hover{color:var(--text2);}
.nav-tab.active{color:var(--text);border-bottom-color:var(--y2);}

/* MAIN */
.main{max-width:960px;margin:0 auto;padding:16px 14px 80px;}

/* SEC HD */
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;gap:10px;flex-wrap:wrap;}
.sec-title{font-size:1em;font-weight:800;color:var(--text);display:flex;align-items:center;gap:8px;}
.sec-title::before{content:'';display:block;width:4px;height:16px;background:linear-gradient(180deg,var(--y2),var(--org));border-radius:2px;}

/* CAT TABS */
.cat-tabs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:13px;}
.cat-tabs::-webkit-scrollbar{display:none;}
.cat-tab{flex-shrink:0;padding:6px 13px;border-radius:20px;border:1.5px solid var(--border2);background:var(--white);color:var(--muted);font-size:0.77em;font-weight:700;cursor:pointer;transition:all .14s;white-space:nowrap;font-family:var(--fn);}
.cat-tab.active{background:var(--y);border-color:var(--y2);color:#111;}
.cat-tab:not(.active):hover{border-color:var(--y2);color:var(--text);}

/* ══ CALCULADORA ══ */
.calc-input-card{background:var(--white);border:1px solid var(--border);border-radius:13px;padding:15px;margin-bottom:13px;}
.calc-lbl{font-size:0.68em;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:7px;display:block;}
.valor-row{display:flex;gap:7px;align-items:stretch;}
.val-prefix{background:linear-gradient(135deg,var(--y),var(--org));color:#111;font-weight:900;font-size:1em;padding:0 13px;border-radius:8px;display:flex;align-items:center;flex-shrink:0;}
.val-input{flex:1;background:var(--bg);border:2px solid var(--border2);border-radius:8px;padding:11px 12px;font-family:var(--fn);font-size:1.35em;font-weight:900;color:var(--text);outline:none;transition:border-color .17s;min-width:0;}
.val-input:focus{border-color:var(--y2);}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:5px;margin-top:10px;max-height:185px;overflow-y:auto;}
.prod-btn{background:var(--bg);border:1.5px solid var(--border2);border-radius:8px;padding:8px 9px;cursor:pointer;text-align:left;transition:all .12s;font-family:var(--fn);}
.prod-btn.sel,.prod-btn:active{border-color:var(--y2);background:var(--ydim);}
.pnome{font-size:0.74em;font-weight:700;color:var(--text2);display:block;line-height:1.3;margin-bottom:2px;}
.ppreco{font-size:0.84em;font-weight:900;color:var(--y2);}

/* RESULTADO CALCULADORA */
.result-card{background:var(--white);border:1px solid var(--border2);border-radius:13px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.08);}
.rc-header{background:#1A1915;padding:13px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.rc-brand{font-size:0.61em;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--y);opacity:.7;}
.rc-name{font-size:0.88em;font-weight:800;color:#fff;margin-top:2px;}
.rc-recebe .rl{font-size:0.61em;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:1px;}
.rc-recebe .rv{font-size:1.15em;font-weight:900;color:var(--y);}
.rc-sub{background:linear-gradient(90deg,var(--y),var(--org));padding:7px 15px;font-size:0.74em;font-weight:900;color:#111;text-transform:uppercase;letter-spacing:.5px;}
.calc-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.calc-table{width:100%;border-collapse:collapse;min-width:340px;}
.calc-table thead tr{background:#1A1915;}
.calc-table thead th{padding:7px 10px;font-size:0.64em;font-weight:800;text-transform:uppercase;letter-spacing:.9px;color:var(--y);text-align:right;white-space:nowrap;}
.calc-table thead th:first-child{text-align:center;}
.calc-table thead th:last-child{text-align:center;width:36px;}
.calc-table tbody tr{border-bottom:1px solid var(--border);}
.calc-table tbody tr:nth-child(odd){background:#FFFBE8;}
.calc-table tbody tr.dest{background:#1A1915;}
.calc-table tbody tr:last-child{border-bottom:none;}
.calc-table tbody td{padding:8px 10px;text-align:right;font-size:0.84em;font-weight:600;color:var(--text2);}
.calc-table tbody tr.dest td{color:var(--y);font-weight:700;}
.calc-table tbody td:first-child{text-align:center;font-size:0.8em;font-weight:900;color:var(--text);}
.calc-table tbody tr.dest td:first-child{color:var(--y);}
.calc-table tbody td:last-child{text-align:center;}
.tv-c{font-weight:900;color:var(--text);}
.calc-table tbody tr.dest .tv-c{color:var(--y);}
.tv-p{color:var(--text2);}
.tv-l{font-size:0.77em;opacity:.6;}
.rc-footer{background:#1A1915;padding:6px 14px;text-align:center;font-size:0.61em;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#555;}
.rc-footer b{color:var(--y);}
.empty-calc{text-align:center;padding:26px 18px;color:var(--muted);font-size:0.86em;font-weight:600;}
.share-btn{background:transparent;border:none;cursor:pointer;padding:3px 5px;border-radius:4px;color:var(--muted);font-size:11px;transition:all .11s;}
.share-btn:hover{background:var(--ydim);color:var(--y2);}
/* Checkbox de parcelas escolhidas p/ mensagem ao cliente */
.calc-table thead th:last-child{width:58px;}
.row-actions{display:flex;align-items:center;justify-content:center;gap:5px;}
.parc-check{width:15px;height:15px;accent-color:var(--y);cursor:pointer;margin:0;flex-shrink:0;}

/* ══ TABELA DE PREÇOS + ESTOQUE ══ */
.tbl-section{margin-bottom:12px;}
.tbl-sec-hd{background:linear-gradient(90deg,rgba(255,200,0,0.1),rgba(255,120,0,0.05));border:1px solid rgba(255,200,0,0.2);border-radius:9px 9px 0 0;padding:9px 13px;font-size:0.7em;font-weight:900;text-transform:uppercase;letter-spacing:1.5px;color:var(--text);display:flex;align-items:center;gap:7px;}
.tbl-sec-hd::before{content:'';display:block;width:3px;height:10px;background:linear-gradient(180deg,var(--y2),var(--org));border-radius:2px;}
.tbl-outer{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-top:none;border-radius:0 0 9px 9px;background:var(--white);}
.tbl-main{width:100%;border-collapse:collapse;min-width:0;}
.tbl-main thead tr{background:#F5F3EC;}
.tbl-main thead th{padding:7px 10px;text-align:center;font-size:0.66em;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);white-space:nowrap;}
.tbl-main thead th:first-child{text-align:left;min-width:100px;position:sticky;left:0;background:#F5F3EC;z-index:2;}
.tbl-main tbody tr{border-bottom:1px solid var(--border);}
.tbl-main tbody tr:last-child{border-bottom:none;}
.tbl-main tbody tr:hover{background:rgba(255,214,0,0.04);}
.tbl-main tbody td{padding:9px 10px;text-align:center;color:var(--text2);font-size:0.83em;font-weight:600;white-space:nowrap;}
.tbl-main tbody td:first-child{text-align:left;font-weight:700;color:var(--text);position:sticky;left:0;background:var(--white);z-index:1;}
.tbl-main tbody tr:hover td:first-child{background:rgba(255,250,220,0.9);}
.p-avista{font-weight:900;color:var(--green)!important;white-space:nowrap;}
.p-parc .pv{font-weight:700;color:var(--text);}
.p-parc .pm{font-size:0.76em;color:var(--muted);display:block;}
.p-min{color:var(--purple)!important;font-weight:800!important;}
.p-qtde{font-weight:800;}
.p-qtde.q0{color:var(--red)!important;}
.p-qtde.qfew{color:var(--orange)!important;}
.p-qtde.qok{color:var(--green)!important;}
.p-custo{color:var(--text2)!important;font-weight:700;white-space:nowrap;}
.p-est{line-height:1.5;}
.p-est.q0{color:var(--red);}
.p-est.qfew{color:var(--orange);}
.p-est.qok{color:var(--green);}
.p-est-total{font-weight:900;font-size:0.95em;margin-top:2px;color:var(--text);}
.cores-mini{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;font-size:0.7em;font-weight:600;color:var(--text2);}
.calc-btn{background:var(--ydim);border:1px solid rgba(255,200,0,0.3);color:var(--y2);border-radius:5px;padding:3px 7px;font-size:0.68em;font-weight:700;cursor:pointer;transition:all .12s;white-space:nowrap;font-family:var(--fn);}
.calc-btn:hover{background:var(--y);color:#111;}
.p-obs{font-size:0.72em;color:var(--orange);font-style:italic;display:block;margin-top:2px;white-space:normal;max-width:100px;}

/* PARC CONFIG */
.parc-config{background:var(--white);border:1px solid var(--border);border-radius:11px;padding:13px 15px;margin-bottom:13px;}
.parc-config-title{font-size:0.72em;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:8px;}
.parc-grid{display:flex;gap:6px;flex-wrap:wrap;}
.parc-chip{padding:5px 11px;border-radius:20px;border:1.5px solid var(--border2);background:var(--bg);color:var(--muted);font-size:0.77em;font-weight:700;cursor:pointer;transition:all .13s;user-select:none;font-family:var(--fn);}
.parc-chip.on{background:var(--y);border-color:var(--y2);color:#111;}

/* ══ FOTOS ══ */
.foto-card{background:var(--white);border:1px solid var(--border);border-radius:11px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:7px;transition:all .14s;}
.foto-card.has{cursor:pointer;border-left:3px solid var(--y2);}
.foto-card.has:hover{border-color:var(--y2);background:var(--ydim);}
.fc-name{font-size:0.87em;font-weight:700;color:var(--text);margin-bottom:2px;}
.fc-cat{font-size:0.66em;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);}
.fc-icon{width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:0.95em;}
.fc-icon.has{background:var(--ydim);}
.fc-icon.no{background:var(--surface);}

/* ══ CRM ══ */
.crm-stats-bar{background:linear-gradient(135deg,rgba(255,200,0,0.08),rgba(255,120,0,0.04));border:1px solid rgba(255,200,0,0.15);border-radius:11px;padding:12px 15px;margin-bottom:12px;display:flex;gap:16px;flex-wrap:wrap;}
.cs-item{text-align:center;}
.cs-val{font-size:1.3em;font-weight:900;line-height:1;}
.cs-lbl{font-size:0.63em;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-top:1px;}
.vend-sel-wrap{display:flex;align-items:center;gap:8px;margin-bottom:11px;flex-wrap:wrap;}
.vend-sel{background:var(--white);border:1.5px solid var(--border2);border-radius:8px;color:var(--text);font-family:var(--fn);font-size:0.84em;font-weight:700;padding:7px 11px;outline:none;cursor:pointer;}
.vend-sel:focus{border-color:var(--y2);}
.metrica-bar{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:12px;position:relative;overflow:hidden;}
.metrica-bar::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--y2),var(--org));}
.mb-nome{font-size:0.88em;font-weight:800;color:var(--text);margin-bottom:7px;}
.mb-vals{display:flex;gap:14px;flex-wrap:wrap;}
.mb-item{text-align:center;}
.mb-num{font-size:1.2em;font-weight:900;line-height:1;}
.mb-lbl{font-size:0.62em;color:var(--muted);font-weight:700;text-transform:uppercase;}
.lead-card{background:var(--white);border:1px solid var(--border);border-radius:11px;overflow:hidden;margin-bottom:8px;transition:border-color .14s;}
.lead-card:hover{border-color:rgba(255,200,0,0.3);}
.lead-top{padding:10px 13px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.lead-nome{font-size:0.9em;font-weight:800;color:var(--text);margin-bottom:2px;}
.lead-fone{font-size:0.74em;color:var(--muted);}
.lead-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;}
.ltag{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:0.67em;font-weight:700;}
.lt-novo{background:var(--bluel);color:var(--blue);}
.lt-neg{background:var(--ydim);color:var(--y2);}
.lt-prop{background:var(--orangel);color:var(--orange);}
.lt-fechado{background:var(--greenl);color:var(--green);}
.lt-perdido{background:var(--redl);color:var(--red);}
.lt-mod{background:rgba(0,0,0,.07);color:var(--text2);}
.lt-vend{background:rgba(0,0,0,.07);color:var(--text2);}
.lead-date{font-size:0.67em;color:var(--muted);white-space:nowrap;flex-shrink:0;}
.lead-body{padding:0 13px 10px;}
.lead-det{font-size:0.78em;color:var(--text2);line-height:1.5;margin-bottom:5px;}
.lead-obj{background:var(--redl);border-left:3px solid var(--red);border-radius:0 5px 5px 0;padding:5px 9px;font-size:0.76em;color:var(--text2);margin-bottom:5px;}
.lead-btns{display:flex;gap:5px;flex-wrap:wrap;}

/* ADMIN */
.admin-login{display:flex;align-items:center;justify-content:center;min-height:58vh;}
.login-box{background:var(--white);border:1px solid var(--border2);border-radius:15px;padding:26px 22px;width:100%;max-width:330px;text-align:center;}
.login-icon{width:48px;height:48px;background:linear-gradient(135deg,var(--y),var(--org));border-radius:11px;margin:0 auto 13px;display:flex;align-items:center;justify-content:center;font-size:1.3em;}
.login-title{font-size:1.05em;font-weight:900;margin-bottom:3px;}
.login-sub{font-size:0.78em;color:var(--muted);margin-bottom:16px;}
.login-input{width:100%;padding:10px 12px;border:1.5px solid var(--border2);border-radius:8px;background:var(--bg);font-family:var(--fn);font-size:0.88em;color:var(--text);outline:none;margin-bottom:7px;}
.login-input:focus{border-color:var(--y2);}
.login-err{font-size:0.74em;color:var(--red);min-height:15px;margin-bottom:5px;}
.admin-tabs{display:flex;gap:4px;margin-bottom:13px;background:var(--surface);border-radius:9px;padding:3px;flex-wrap:wrap;}
.admin-tab{padding:6px 12px;border-radius:7px;border:none;cursor:pointer;font-family:var(--fn);font-weight:700;font-size:0.76em;background:transparent;color:var(--muted);transition:all .14s;}
.admin-tab.active{background:var(--y);color:#111;}
.esec{background:var(--white);border-radius:10px;border:1px solid var(--border);margin-bottom:9px;overflow:hidden;}
.esec-h{background:var(--surface);padding:10px 13px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;}
.esec-h h3{font-size:0.75em;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--text2);}
.esec-h .arr{font-size:10px;color:var(--muted);transition:transform .18s;}
.esec-h.open .arr{transform:rotate(180deg);}
.esec-b{padding:11px;display:none;}
.esec-b.open{display:block;}
.aviso-edit{background:var(--ydim);border:1px solid rgba(255,200,0,0.25);border-radius:9px;padding:10px 13px;margin-bottom:10px;font-size:0.79em;color:var(--text2);line-height:1.65;}
.aviso-edit b{color:var(--y2);}
.cat-row{display:flex;align-items:center;gap:7px;margin-bottom:6px;background:var(--bg);border-radius:7px;padding:8px 10px;border:1px solid var(--border);}
.cat-icon{font-size:13px;flex-shrink:0;}
input.cat-name{flex:1;font-size:0.87em;font-weight:800;background:var(--white);border:1.5px solid var(--border2);border-radius:6px;color:var(--text);font-family:var(--fn);outline:none;min-width:0;padding:4px 8px;}

function cpParc(av,p){
  try{
    const t=taxas.find(x=>x.p===p);
    if(!t||!av)return{c:0,pa:0};
    const c=av/(1-t.j/100);
    return{c,pa:c/p};
  }catch(e){return{c:0,pa:0};}
}

async function init(){
  setSync('','Conectando...');let ok=false;
  onSnapshot(dCalc,s=>{
    if(salvando)return;
    if(s.exists()){const d=s.data();taxas=d.taxas||TX_DEF;cats=d.cats||CATS_DEF;}
    else setDoc(dCalc,{taxas:TX_DEF,cats:CATS_DEF});
    if(!ok){ok=true;hideLoad();setSync('ok','Online');}
    if(tab==='calc')renderCalc(); else if(tab==='home')renderHome();
  },()=>{hideLoad();setSync('err','Offline');});
  getDoc(dPrec).then(s=>{
    if(s.exists()){
      const d=s.data();
      if(d.secoes) d.secoes.forEach(sec=>{if(sec.items)sec.items=sec.items.map(it=>({n:it.n||it.nome||'',av:it.av||it.avista||0,mn:it.mn||it.min||0}));});
      precos=d;
      if(!precos.parcelas||!precos.parcelas.length)precos.parcelas=[6,12,18,24];
    } else { setDoc(dPrec,PREC_DEF); }
    if(tab==='tabela')renderTabela();
  }).catch(()=>{if(tab==='tabela')renderTabela();});
  onSnapshot(dEst,s=>{if(s.exists())estoque=s.data();else setDoc(dEst,EST_DEF);if(tab==='tabela'){renderTblBody();}});
  onSnapshot(dCRM,s=>{if(s.exists())crm=s.data();else setDoc(dCRM,CRM_DEF);if(tab==='crm')renderCRM();});
  onSnapshot(dMsgs,s=>{if(s.exists()&&Array.isArray(s.data().items))quickMsgs=s.data().items;else setDoc(dMsgs,{items:QUICK_MSGS_DEF});if(tab==='mensagens')renderMensagens();});
  getDoc(dFot).then(s=>{if(s.exists())fotos=s.data();else setDoc(dFot,FOT_DEF);if(tab==='fotos')renderFotos();});
}

window.goTab=t=>{
  tab=t;
  document.querySelectorAll('.nav-tab').forEach(x=>x.classList.remove('active'));
  const id='nav'+t.charAt(0).toUpperCase()+t.slice(1);
  document.getElementById(id)?.classList.add('active');
  document.getElementById('main').innerHTML='';
  if(t==='home')renderHome();
  else if(t==='calc')renderCalc();
  else if(t==='crm')renderCRM();
  else if(t==='agenda')renderAgenda();
  else if(t==='mensagens')renderMensagens();
  else if(t==='tabela')renderTabela();
  else if(t==='fotos')renderFotos();
  else if(t==='cadastros')renderCadastros();
  else if(t==='admin')renderAdmin();
  window.scrollTo(0,0);
};

function gerarMsgCliente(){
  const v=parseBR(document.getElementById('vInp')?.value||'0');
  const modelo=nomeCalc||'Veículo elétrico';
  const marcadas=getParcelasCliente().slice().sort((a,b)=>a-b);
  const linhas=marcadas.map(p=>{
    const tx=taxas.find(t=>t.p===p);if(!tx)return null;
    const c=v/(1-tx.j/100),pa=c/p;
    return'\u2022 *'+p+'x* de *'+fmt(pa)+'*';
  }).filter(Boolean).join('\n');
  return getMsgTemplate()
    .replace(/{modelo}/g,modelo)
    .replace(/{avista}/g,fmt(v))
    .replace(/{parcelas}/g,linhas);
}

window.copiarMsgCliente=()=>{
  const v=parseBR(document.getElementById('vInp')?.value||'0');
  if(!v||v<=0){toast('Digite ou selecione um valor primeiro.','⚠️');return;}
  const marcadas=getParcelasCliente();
  if(!marcadas.length){toast('Marque pelo menos uma parcela.','⚠️');return;}
  const txt=gerarMsgCliente();
  navigator.clipboard.writeText(txt).then(()=>toast('Mensagem copiada!')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('Mensagem copiada!');}catch(e){toast('Erro ao copiar','⚠️');}
    document.body.removeChild(ta);
  });
};

function getEstItem(nome){
  try{
    const items=estoque.items||[];
    if(!items.length)return null;
    return items.find(it=>{
      const a=(it.nome||'').toLowerCase().trim();
      const b=(nome||'').toLowerCase().trim();
      return a===b||a.includes(b)||b.includes(a);
    })||null;
  }catch(e){return null;}
}

/* Converte formato antigo (cores string + qtde único) OU novo (coresList) numa lista [{cor,qtde}] */
function normCoresList(it){
  if(!it)return[];
  if(Array.isArray(it.coresList))return it.coresList.map(c=>({cor:c.cor||'',qtde:parseInt(c.qtde)||0}));
  if(it.cores){
    const nomes=String(it.cores).split(',').map(s=>s.trim()).filter(Boolean);
    if(nomes.length)return nomes.map((cor,i)=>({cor,qtde:i===0?(parseInt(it.qtde)||0):0}));
  }
  if(it.qtde)return[{cor:'',qtde:parseInt(it.qtde)||0}];
  return[];
}
function totalQtde(it){return normCoresList(it).reduce((s,c)=>s+(c.qtde||0),0);}

                :(est?'<span style="color:var(--muted);">—</span>':'<span style="color:var(--muted);">—</span>');

window.compTabelaGeral=()=>{
  const secs=precos.secoes||[];
  let txt=`📦 *ESTOQUE E-PULSE*\n📍 Criciúma e região\n${'─'.repeat(22)}\n\n`;
  let temItem=false;
  secs.forEach(sec=>{
    const linhas=(sec.items||[]).map(item=>{
      const est=getEstItem(item.n);
      const total=totalQtde(est);
      if(!est||total<=0)return null;
      const cores=normCoresList(est).filter(c=>c.qtde>0).map(c=>`${c.qtde} ${c.cor||'—'}`).join(', ');
      return`• *${item.n}* — Total: ${total}${cores?` (${cores})`:''}`;
    }).filter(Boolean);
    if(linhas.length){temItem=true;txt+=`*${sec.nome.toUpperCase()}*\n${linhas.join('\n')}\n\n`;}
  });
  if(!temItem){toast('Nenhum item com estoque cadastrado ainda.','⚠️');return;}
  txt+=`_E-Pulse · Veículos Elétricos_`;
  window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
};

  const all=Object.entries(fotos).flatMap(([cat,items])=>(items||[]).map(v=>({...v,cat})));
  m.innerHTML=`
    <div class="sec-hd"><div class="sec-title">Fotos dos Modelos</div></div>
    <div class="cat-tabs" id="fotCatTabs">
      <button class="cat-tab active" onclick="filtFotos('all',this)">Todos (${all.length})</button>
      ${Object.entries(FCAT_L).map(([k,l])=>`<button class="cat-tab" onclick="filtFotos('${k}',this)">${FCAT_I[k]} ${l} (${(fotos[k]||[]).length})</button>`).join('')}
    </div>
    <div id="fotBody">${renderFotosBody(all)}</div>
  `;
}
function renderFotosBody(items){
  if(!items.length)return'<div class="empty-state"><div class="empty-icon">📸</div><div class="empty-txt">Nenhuma foto ainda.<br>Admin → Fotos para adicionar links.</div></div>';
  return items.map(v=>`
    <div class="foto-card ${v.url?'has':''}" ${v.url?`onclick="abrirFoto('${encodeURIComponent(JSON.stringify({name:v.name,url:v.url}))}')"`:''}>
      <div><div class="fc-name">${esc(v.name)}</div><div class="fc-cat">${FCAT_I[v.cat]||''} ${FCAT_L[v.cat]||v.cat}</div></div>
      <div class="fc-icon ${v.url?'has':'no'}">${v.url?'📸':'🔒'}</div>
    </div>`).join('');
}
window.filtFotos=(cat,btn)=>{
  document.querySelectorAll('#fotCatTabs .cat-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  const all=Object.entries(fotos).flatMap(([c,items])=>(items||[]).map(v=>({...v,cat:c})));
  document.getElementById('fotBody').innerHTML=renderFotosBody(cat==='all'?all:all.filter(v=>v.cat===cat));
};
window.abrirFoto=enc=>{
  const v=JSON.parse(decodeURIComponent(enc));
  const url=v.url.includes('drive.google.com')?v.url.replace(/\/(view|edit).*/,'')+`?usp=sharing`:v.url;
  openModal(`<div class="modal-hd"><div class="modal-title">📸 ${esc(v.name)}</div><button class="modal-close" onclick="closeModal()">✕</button></div>
  <p style="font-size:0.8em;color:var(--muted);margin-bottom:14px;">Fotos no Google Drive</p>
  <a href="${esc(url)}" target="_blank" class="btn btn-y btn-full" style="text-decoration:none;display:flex;justify-content:center;">↗ Abrir Fotos no Drive</a>
  <button class="btn btn-ghost btn-full" style="margin-top:8px;" onclick="closeModal()">Fechar</button>`);
};

function renderCRM(){
  const m=document.getElementById('main');
  const leads=crm.leads||[];
  const vends=crm.vendedores||[];
  const fL=crmVend==='all'?leads:leads.filter(l=>l.vendedor===crmVend);
  const fLS=crmSt==='all'?fL:fL.filter(l=>l.status===crmSt);
  const tot=fL.length,fec=fL.filter(l=>l.status==='Fechado').length;
  const atv=fL.filter(l=>l.status!=='Fechado'&&l.status!=='Perdido').length;
  const perd=fL.filter(l=>l.status==='Perdido').length;

  let h=`<div class="sec-hd"><div class="sec-title">Controle de Vendas</div>
    <button class="btn btn-y btn-sm" onclick="abrirNovoLead()">+ Novo Lead</button></div>
  <div class="crm-stats-bar">
    <div class="cs-item"><div class="cs-val">${tot}</div><div class="cs-lbl">Leads</div></div>
    <div class="cs-item"><div class="cs-val" style="color:var(--green)">${fec}</div><div class="cs-lbl">Fechados</div></div>
    <div class="cs-item"><div class="cs-val" style="color:var(--orange)">${atv}</div><div class="cs-lbl">Ativos</div></div>
    <div class="cs-item"><div class="cs-val" style="color:var(--red)">${perd}</div><div class="cs-lbl">Perdidos</div></div>
    ${tot>0?`<div class="cs-item"><div class="cs-val" style="color:var(--y2)">${Math.round((fec/tot)*100)}%</div><div class="cs-lbl">Conversão</div></div>`:''}
  </div>
  <div class="vend-sel-wrap">
    <span style="font-size:0.72em;font-weight:700;color:var(--muted);">VENDEDOR:</span>
    <select class="vend-sel" onchange="filtCRMVend(this.value)">
      <option value="all">Todos</option>
      ${vends.map(v=>`<option value="${v.id}"${crmVend===v.id?' selected':''}>${esc(v.nome)}</option>`).join('')}
    </select>
  </div>`;

  if(crmVend!=='all'){
    const v=vends.find(x=>x.id===crmVend);
    if(v){
      const mL=leads.filter(l=>l.vendedor===crmVend);
      const mF=mL.filter(l=>l.status==='Fechado').length;
      h+=`<div class="metrica-bar"><div class="mb-nome">👤 ${esc(v.nome)}</div>
      <div class="mb-vals">
        <div class="mb-item"><div class="mb-num">${mL.length}</div><div class="mb-lbl">Leads</div></div>
        <div class="mb-item"><div class="mb-num" style="color:var(--green)">${mF}</div><div class="mb-lbl">Fechados</div></div>
        <div class="mb-item"><div class="mb-num" style="color:var(--y2)">${mL.length>0?Math.round((mF/mL.length)*100):0}%</div><div class="mb-lbl">Conversão</div></div>
      </div></div>`;
    }
  }

  h+=`<div class="cat-tabs" id="crmStTabs">
    <button class="cat-tab${crmSt==='all'?' active':''}" onclick="filtCRMSt('all',this)">Todos</button>
    ${LSTAT.map(s=>`<button class="cat-tab${crmSt===s?' active':''}" onclick="filtCRMSt('${esc(s)}',this)">${s}</button>`).join('')}
  </div>
  <div id="leadList">${renderLeadList(fLS)}</div>`;
  m.innerHTML=h;
}

window.filtCRMVend=v=>{crmVend=v;crmSt='all';renderCRM();};
window.filtCRMSt=(s,btn)=>{
  crmSt=s;
  document.querySelectorAll('#crmStTabs .cat-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  const fL=crmVend==='all'?(crm.leads||[]):(crm.leads||[]).filter(l=>l.vendedor===crmVend);
  document.getElementById('leadList').innerHTML=renderLeadList(s==='all'?fL:fL.filter(l=>l.status===s));
};

function renderLeadList(leads){
  if(!leads.length)return'<div class="empty-state"><div class="empty-icon">💼</div><div class="empty-txt">Nenhum lead</div></div>';
  const vends=crm.vendedores||[];
  return leads.map(lead=>{
    const ri=(crm.leads||[]).indexOf(lead);
    const vend=vends.find(v=>v.id===lead.vendedor);
    const sc=LSCLS[lead.status]||'lt-novo';
    return`<div class="lead-card">
      <div class="lead-top">
        <div>
          <div class="lead-nome">${esc(lead.nome)}</div>
          <div class="lead-fone">${esc(lead.fone||'')}</div>
          <div class="lead-tags">
            <span class="ltag ${sc}">${lead.status||'Novo Lead'}</span>
            ${lead.modelo?`<span class="ltag lt-mod">🛵 ${esc(lead.modelo)}</span>`:''}
            ${vend?`<span class="ltag lt-vend">👤 ${esc(vend.nome)}</span>`:''}
          </div>
        </div>
        <div class="lead-date">${fmtD(lead.data)}</div>
      </div>
      <div class="lead-body">
        ${lead.det?`<div class="lead-det">💬 ${esc(lead.det)}</div>`:''}
        ${lead.objecao?`<div class="lead-obj">⚠️ Objeção: ${esc(lead.objecao)}</div>`:''}
        <div class="lead-btns">
          <button class="btn btn-edit btn-sm" onclick="editLead(${ri})">✏️ Editar</button>
          <button class="btn btn-danger btn-sm" onclick="delLead(${ri})">🗑</button>
          ${lead.fone?`<button class="btn btn-y btn-sm" onclick="wtsLead('${esc(lead.nome)}','${esc(lead.fone)}')">📲 WA</button>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
}

window.abrirNovoLead=()=>leadModal({},-1);
window.editLead=i=>leadModal(crm.leads[i],i);
window.delLead=async i=>{if(!confirm('Remover lead?'))return;crm.leads.splice(i,1);await saveFB(dCRM,crm,'CRM');renderCRM();};
window.wtsLead=(n,f)=>{const num=f.replace(/\D/g,'');window.open(`https://wa.me/55${num}?text=${encodeURIComponent(`Olá ${n}! Sou da *E-Pulse Veículos Elétricos* de Criciúma. Gostaria de continuar nossa conversa. 😊`)}`,'_blank');};
function leadModal(lead,idx){
  const vends=crm.vendedores||[];
  openModal(`<div class="modal-hd"><div class="modal-title">${idx===-1?'Novo Lead':'Editar Lead'}</div><button class="modal-close" onclick="closeModal()">✕</button></div>
  <div class="ef-grid">
    <div class="ef-full"><label class="ef-lbl">Nome *</label><input class="ef-inp ef-full" id="ll_n" placeholder="Nome completo" value="${esc(lead.nome||'')}"></div>
    <div><label class="ef-lbl">Telefone</label><input class="ef-inp" id="ll_f" placeholder="(48) 99999-9999" value="${esc(lead.fone||'')}"></div>
    <div><label class="ef-lbl">Modelo</label><input class="ef-inp" id="ll_m" placeholder="Ex: Torino 1000W" value="${esc(lead.modelo||'')}"></div>
    <div><label class="ef-lbl">Status</label><select class="ef-inp ef-sel" id="ll_s">${LSTAT.map(s=>`<option${(lead.status||'Novo Lead')===s?' selected':''}>${s}</option>`).join('')}</select></div>
    <div><label class="ef-lbl">Vendedor</label><select class="ef-inp ef-sel" id="ll_v"><option value="">— Sem —</option>${vends.map(v=>`<option value="${v.id}"${lead.vendedor===v.id?' selected':''}>${esc(v.nome)}</option>`).join('')}</select></div>
    <div class="ef-full"><label class="ef-lbl">O que falta para fechar</label><textarea class="ef-inp ef-ta ef-full" id="ll_d" placeholder="Aguarda aprovação, quer testar...">${esc(lead.det||'')}</textarea></div>
    <div class="ef-full"><label class="ef-lbl">Objeção de Venda</label><input class="ef-inp ef-full" id="ll_o" placeholder="Ex: Preço alto, prefere gasolina..." value="${esc(lead.objecao||'')}"></div>
  </div>
  <div style="display:flex;gap:7px;margin-top:11px;">
    <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-y" onclick="saveLead(${idx})">💾 Salvar</button>
  </div>`);
}
window.saveLead=async idx=>{
  const it={nome:document.getElementById('ll_n').value.trim(),fone:document.getElementById('ll_f').value.trim(),modelo:document.getElementById('ll_m').value.trim(),status:document.getElementById('ll_s').value,vendedor:document.getElementById('ll_v').value,det:document.getElementById('ll_d').value.trim(),objecao:document.getElementById('ll_o').value.trim(),data:idx===-1?new Date().toISOString():(crm.leads[idx]?.data||new Date().toISOString()),updatedAt:new Date().toISOString()};
  if(!it.nome){toast('Digite o nome','⚠️');return;}
  if(!crm.leads)crm.leads=[];
  if(idx===-1)crm.leads.push(it);else crm.leads[idx]=it;
  closeModal();await saveFB(dCRM,crm,'CRM');renderCRM();
};

let _cads=[];
async function renderCadastros(){
  const m=document.getElementById('main');
  m.innerHTML='<div class="sec-hd"><div class="sec-title">Cadastros de Clientes</div>'
    +'<button class="btn btn-y btn-sm" onclick="copiarLinkCad()">&#128279; Copiar Link do Form</button></div>'
    +'<div id="cadStats" class="cad-stats">'
      +'<div class="cad-stat"><div class="cad-stat-num">...</div><div class="cad-stat-lbl">Total</div></div>'
    +'</div>'
    +'<input class="cad-search" id="cadSrch" placeholder="Buscar nome, CPF, modelo, telefone..." oninput="filtrarCad(this.value)">'
    +'<div id="cadList"><div class="empty-state"><div class="empty-icon">&#8987;</div><div class="empty-txt">Carregando cadastros...</div></div></div>';
  try{
    const q=query(colClientes,orderBy('criadoEm','desc'));
    const snap=await getDocs(q);
    const todos=[];
    snap.forEach(d=>todos.push({id:d.id,...d.data()}));
    _cads=todos;
    const hoje=new Date().toLocaleDateString('pt-BR');
    const hj=todos.filter(c=>{try{const dt=c.criadoEm&&c.criadoEm.toDate?c.criadoEm.toDate():new Date(c.criadoEm);return dt.toLocaleDateString('pt-BR')===hoje;}catch{return false;}}).length;
    const st=document.getElementById('cadStats');
    if(st)st.innerHTML=''
      +'<div class="cad-stat"><div class="cad-stat-num">'+todos.length+'</div><div class="cad-stat-lbl">Total</div></div>'
      +'<div class="cad-stat"><div class="cad-stat-num" style="color:var(--green)">'+hj+'</div><div class="cad-stat-lbl">Hoje</div></div>'
      +'<div class="cad-stat"><div class="cad-stat-num" style="color:var(--orange)">'+todos.filter(c=>c.modelo).length+'</div><div class="cad-stat-lbl">Com modelo</div></div>';
    renderCadList(todos);
  }catch(e){
    const el=document.getElementById('cadList');
    if(el)el.innerHTML='<div class="empty-state"><div class="empty-icon">X</div><div class="empty-txt">Erro: '+e.message+'</div></div>';
  }
}
window.filtrarCad=v=>{
  const f=v.toLowerCase();
  renderCadList(_cads.filter(c=>(c.nome||'').toLowerCase().includes(f)||(c.cpf||'').includes(f)||(c.modelo||'').toLowerCase().includes(f)||(c.fone||'').includes(f)));
};
function renderCadList(lista){
  const el=document.getElementById('cadList');if(!el)return;
  if(!lista.length){el.innerHTML='<div class="empty-state"><div class="empty-icon">&#128100;</div><div class="empty-txt">Nenhum cadastro encontrado</div></div>';return;}
  el.innerHTML=lista.map(c=>{
    let data='---';
    try{const dt=c.criadoEm&&c.criadoEm.toDate?c.criadoEm.toDate():new Date(c.criadoEm);data=dt.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});}catch(e){}
    const end=[c.endereco,c.numero,c.complemento,c.bairro,c.cidade,c.uf].filter(Boolean).join(', ')||'---';
    const fone=(c.fone||'').replace(/[^0-9]/g,'');
    return '<div class="cadastro-card">'
      +'<div class="cad-top"><div class="cad-nome">'+esc(c.nome||'---')+'</div><div class="cad-data">'+data+'</div></div>'
      +'<div class="cad-grid">'
        +'<div class="cad-field"><span class="cad-lbl">CPF</span><span class="cad-val">'+esc(c.cpf||'---')+'</span></div>'
        +'<div class="cad-field"><span class="cad-lbl">RG</span><span class="cad-val">'+esc(c.rg||'---')+'</span></div>'
        +'<div class="cad-field"><span class="cad-lbl">Nascimento</span><span class="cad-val">'+esc(c.nascimento||'---')+'</span></div>'
        +'<div class="cad-field"><span class="cad-lbl">WhatsApp</span><span class="cad-val">'+esc(c.fone||'---')+'</span></div>'
        +'<div class="cad-field cw"><span class="cad-lbl">E-mail</span><span class="cad-val">'+esc(c.email||'---')+'</span></div>'
        +'<div class="cad-field cw"><span class="cad-lbl">Endereco</span><span class="cad-val">'+esc(end)+'</span></div>'
        +(c.modelo?'<div class="cad-field cw"><span class="cad-lbl">Modelo</span><span class="cad-val cad-model">'+esc(c.modelo)+'</span></div>':'')
        +(c.obs?'<div class="cad-field cw"><span class="cad-lbl">Obs</span><span class="cad-val">'+esc(c.obs)+'</span></div>':'')
      +'</div>'
      +'<div class="cad-btns">'
        +(fone?'<a href="https://wa.me/55'+fone+'" target="_blank" class="btn btn-y btn-sm">WA</a>':'')
        +'<button class="btn btn-edit btn-sm" onclick="copiarBling(\''+c.id+'\')">Copiar pro Bling</button>'
      +'</div></div>';
  }).join('');
}
window.copiarLinkCad=()=>{
  const url=window.location.href.replace(/[?#].*/,'').replace(/index\.html$/,'')+'epulse-cadastro.html';
  navigator.clipboard.writeText(url).then(()=>toast('Link copiado! Envie ao cliente')).catch(()=>alert('Link: '+url));
};
window.copiarBling=id=>{
  const c=_cads.find(x=>x.id===id);if(!c)return;
  navigator.clipboard.writeText([c.nome,c.cpf,c.rg,c.nascimento,c.fone,c.celular,c.email,c.cep,c.cidade,c.uf,c.endereco,c.numero,c.complemento,c.bairro].join('\t')).then(()=>toast('Copiado! Cole no Bling')).catch(()=>toast('Erro ao copiar'));
};

/* ADMIN CALC */
function renderAdmCalc(){
  document.getElementById('admSub').innerHTML=`
    <div class="aviso-edit">✏️ <b>Edite</b> produtos e taxas. Salve ao terminar.</div>
    <div class="esec" id="aSecP"><div class="esec-h open" onclick="toggleE('aSecP')"><h3>📦 Produtos</h3><span class="arr">▼</span></div><div class="esec-b open" id="aBP"></div></div>
    <div class="esec" id="aSecT"><div class="esec-h" onclick="toggleE('aSecT')"><h3>💳 Taxas</h3><span class="arr">▼</span></div><div class="esec-b" id="aBT"></div></div>
    <button class="btn-salvar" onclick="salvarCalc()">☁️ Salvar</button>`;
  renderEP();renderET();
}
window.toggleE=id=>{const s=document.getElementById(id),h=s.querySelector('.esec-h'),b=s.querySelector('.esec-b');h.classList.toggle('open');b.classList.toggle('open');h.querySelector('.arr').style.transform=h.classList.contains('open')?'rotate(180deg)':'';};
function lerInps(){
  document.querySelectorAll('[data-ci][data-pi]').forEach(i=>{const ci=+i.dataset.ci,pi=+i.dataset.pi;if(!cats[ci]?.prods[pi])return;if(i.classList.contains('pn'))cats[ci].prods[pi].n=i.value;if(i.classList.contains('pv'))cats[ci].prods[pi].v=parseBR(i.value);});
  document.querySelectorAll('[data-cn]').forEach(i=>{const ci=+i.dataset.cn;if(cats[ci])cats[ci].nome=i.value;});
}
function renderEP(){
  const b=document.getElementById('aBP');if(!b)return;b.innerHTML='';
  cats.forEach((cat,ci)=>{
    const cr=document.createElement('div');cr.className='cat-row';
    cr.innerHTML=`<span class="cat-icon">📁</span><input class="cat-name" type="text" value="${esc(cat.nome)}" data-cn="${ci}"><button class="btn-dc" data-dc="${ci}">🗑️</button>`;
    b.appendChild(cr);
    const pd=document.createElement('div');pd.style.paddingLeft='5px';
    cat.prods.forEach((p,pi)=>{const r=document.createElement('div');r.className='prod-row';r.innerHTML=`<input class="pn" type="text" value="${esc(p.n)}" data-ci="${ci}" data-pi="${pi}"><span class="sep2">·</span><input class="pv" type="text" value="${f2(p.v)}" inputmode="decimal" data-ci="${ci}" data-pi="${pi}"><button class="btn-dp" data-dp="${ci}-${pi}">✕</button>`;pd.appendChild(r);});
    const ap=document.createElement('button');ap.className='btn-ap';ap.textContent='+ Produto';ap.setAttribute('data-ap',ci);
    pd.appendChild(ap);b.appendChild(pd);
    if(ci<cats.length-1){const hr=document.createElement('hr');hr.className='hr-c';b.appendChild(hr);}
  });
  const ac=document.createElement('button');ac.className='btn-ac';ac.id='btnAC_';ac.textContent='+ Nova Categoria';b.appendChild(ac);
  b.onclick=e=>{
    const dc=e.target.closest('[data-dc]'),dp=e.target.closest('[data-dp]'),ap=e.target.closest('[data-ap]'),ac=e.target.closest('#btnAC_');
    if(dc){lerInps();const ci=+dc.dataset.dc;if(!confirm(`Remover "${cats[ci].nome}"?`))return;cats.splice(ci,1);renderEP();}
    if(dp){lerInps();const[ci,pi]=dp.dataset.dp.split('-').map(Number);cats[ci].prods.splice(pi,1);renderEP();}
    if(ap){lerInps();const ci=+ap.dataset.ap;cats[ci].prods.push({n:'Novo produto',v:0});renderEP();}
    if(ac){lerInps();cats.push({id:'c'+Date.now(),nome:'Nova categoria',prods:[]});renderEP();}
  };
}
function renderET(){
  const b=document.getElementById('aBT');if(!b)return;
  b.innerHTML='<p class="ti">Taxa (%) da operadora de cartão por parcela.</p>';
  taxas.forEach((t,i)=>{const r=document.createElement('div');r.className='taxa-row';r.innerHTML=`<span class="tx-l">${t.p}x</span><input class="tv" type="text" value="${t.j.toFixed(2)}" inputmode="decimal" data-ti="${i}"><span class="tx-u">%</span>`;b.appendChild(r);});
  b.querySelectorAll('.tv').forEach(i=>{i.addEventListener('change',()=>{taxas[+i.dataset.ti].j=parseFloat(i.value.replace(',','.'))||0;});});
}
window.salvarCalc=async()=>{lerInps();document.querySelectorAll('.tv').forEach(i=>{taxas[+i.dataset.ti].j=parseFloat(i.value.replace(',','.'))||0;});await saveFB(dCalc,{taxas,cats},'Calculadora');};

/* ADMIN PREÇOS */
function renderAdmPrecos(){
  const c=document.getElementById('admSub');
  const secs=precos.secoes||[];
  c.innerHTML=`<div class="aviso-edit">✏️ Edite a tabela de preços e os preços mínimos.</div>
  <div id="pAdmBody">
    ${secs.map((sec,si)=>`
      <div class="esec" id="ps${si}">
        <div class="esec-h ${si===0?'open':''}" onclick="toggleE('ps${si}')"><h3>${esc(sec.nome)}</h3><span class="arr" style="${si===0?'transform:rotate(180deg)':''}">▼</span></div>
        <div class="esec-b ${si===0?'open':''}" id="psb${si}">
          ${(sec.items||[]).map((item,ii)=>`
            <div class="preco-adm-row">
              <span class="par-name">${esc(item.n)}</span>
              <div class="par-prices">
                <span class="par-p">À vista: <b>${fmt(item.av)}</b></span>
                <span class="par-p pmin">Mínimo: <b>${fmt(item.mn||item.av)}</b></span>
              </div>
              <div style="display:flex;gap:4px;">
                <button class="btn btn-edit btn-sm" onclick="editPI(${si},${ii})">✏️</button>
                <button class="btn btn-danger btn-sm" onclick="delPI(${si},${ii})">🗑</button>
              </div>
            </div>`).join('')}
          <button class="btn-ap" onclick="addPI(${si})">+ Produto</button>
        </div>
      </div>`).join('')}
    <button class="btn-ac" onclick="addPS()">+ Nova Seção</button>
  </div>
  <button class="btn-salvar" onclick="salvarPrecos()">☁️ Salvar</button>`;
}
window.editPI=(si,ii)=>{const item=precos.secoes[si].items[ii];openModal(`<div class="modal-hd"><div class="modal-title">Editar Preço</div><button class="modal-close" onclick="closeModal()">✕</button></div><div style="margin-bottom:9px;"><label class="ef-lbl">Nome</label><input class="ef-inp ef-full" id="ep_n" value="${esc(item.n)}" style="width:100%"></div><div class="ef-grid" style="margin-top:8px;"><div><label class="ef-lbl">À Vista (R$)</label><input class="ef-inp" id="ep_av" value="${f2(item.av)}" inputmode="decimal"></div><div><label class="ef-lbl">Mínimo (R$)</label><input class="ef-inp" id="ep_mn" value="${f2(item.mn||item.av)}" inputmode="decimal"><span class="ef-hint">Menor valor possível</span></div></div><div style="display:flex;gap:7px;margin-top:12px;"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-y" onclick="savePI(${si},${ii})">💾 Salvar</button></div>`);};
window.savePI=(si,ii)=>{precos.secoes[si].items[ii]={n:document.getElementById('ep_n').value.trim(),av:parseBR(document.getElementById('ep_av').value),mn:parseBR(document.getElementById('ep_mn').value)};closeModal();renderAdmPrecos();};
window.delPI=(si,ii)=>{if(!confirm('Remover?'))return;precos.secoes[si].items.splice(ii,1);renderAdmPrecos();};
window.addPI=si=>{precos.secoes[si].items.push({n:'Novo modelo',av:0,mn:0});renderAdmPrecos();};
window.addPS=()=>{precos.secoes.push({nome:'Nova Seção',items:[]});renderAdmPrecos();};
window.salvarPrecos=async()=>await saveFB(dPrec,precos,'Preços');

/* ADMIN ESTOQUE */
function renderAdmEstoque(){
  const c=document.getElementById('admSub');const items=estoque.items||[];
  c.innerHTML=`<div class="aviso-edit">✏️ Quantidade, cores, status e observações. Esses dados aparecem na Tabela + Estoque.</div>
  <button class="btn btn-y" style="margin-bottom:11px;" onclick="novoEst()">+ Adicionar ao Estoque</button>
  <div id="estAdmList">
    ${!items.length?'<div class="empty-state"><div class="empty-icon">📦</div><div class="empty-txt">Nenhum item ainda</div></div>':
    items.map((it,i)=>`<div class="adm-row"><div class="ar-info"><div class="ar-name">${esc(it.nome)}</div><div class="ar-meta">${esc(it.categoria||'')} · Total: ${totalQtde(it)} un. · ${it.status||'Disponível'}${it.custo?` · Custo: ${fmt(it.custo)}`:''}</div>${it.obs?`<div style="font-size:0.69em;color:var(--orange);margin-top:2px;">📝 ${esc(it.obs)}</div>`:''}</div><div class="ar-btns"><button class="btn btn-edit btn-sm" onclick="editEst(${i})">✏️</button><button class="btn btn-danger btn-sm" onclick="delEst(${i})">🗑</button></div></div>`).join('')}
  </div>
  <button class="btn-salvar" style="margin-top:11px;" onclick="salvarEst()">☁️ Salvar</button>`;
}
/* Linhas dinâmicas de cor+quantidade no modal de estoque */
let _estCoresDraft=[];
function renderEstCoresRows(){
  const wrap=document.getElementById('eeCoresWrap');if(!wrap)return;
  wrap.innerHTML=_estCoresDraft.map((c,i)=>`
    <div style="display:flex;gap:6px;margin-bottom:6px;align-items:center;">
      <input class="ef-inp" style="flex:2;" placeholder="Cor (ex: Azul)" value="${esc(c.cor)}" oninput="_estCoresDraft[${i}].cor=this.value">
      <input class="ef-inp" style="flex:1;max-width:70px;" type="number" min="0" placeholder="Qtde" value="${c.qtde}" oninput="_estCoresDraft[${i}].qtde=parseInt(this.value)||0">
      <button class="btn btn-danger btn-sm" onclick="removeEstCorRow(${i})">🗑</button>
    </div>`).join('')||'<div class="ef-hint" style="margin-bottom:6px;">Nenhuma cor adicionada ainda.</div>';
}
window.addEstCorRow=()=>{_estCoresDraft.push({cor:'',qtde:1});renderEstCoresRows();};
window.removeEstCorRow=i=>{_estCoresDraft.splice(i,1);renderEstCoresRows();};

function estModal(it,idx){
  const lista=normCoresList(it);
  _estCoresDraft=lista.length?lista.map(c=>({...c})):[{cor:'',qtde:it.qtde||1}];
  openModal(`<div class="modal-hd"><div class="modal-title">${idx===-1?'Novo Item':'Editar Estoque'}</div><button class="modal-close" onclick="closeModal()">✕</button></div>
<div class="ef-grid">
  <div class="ef-full"><label class="ef-lbl">Nome * (igual ao nome na tabela de preços)</label><input class="ef-inp ef-full" id="ee_n" value="${esc(it.nome||'')}" placeholder="Ex: Torino 1000W"></div>
  <div><label class="ef-lbl">Categoria</label><select class="ef-inp ef-sel" id="ee_c">${['Scooter','Bike Elétrica','Patinete','Outro'].map(c=>`<option${(it.categoria||'')==c?' selected':''}>${c}</option>`).join('')}</select></div>
  <div><label class="ef-lbl">Custo (R$)</label><input class="ef-inp" id="ee_custo" value="${it.custo?f2(it.custo):''}" inputmode="decimal" placeholder="0,00"><span class="ef-hint">Interno — não aparece na mensagem ao cliente</span></div>
  <div class="ef-full"><label class="ef-lbl">Status</label><select class="ef-inp ef-sel" id="ee_s">${SOPTS.map(s=>`<option${(it.status||'Disponível')===s?' selected':''}>${s}</option>`).join('')}</select></div>
  <div class="ef-full">
    <label class="ef-lbl">Cores e quantidades</label>
    <div id="eeCoresWrap"></div>
    <button class="btn btn-ghost btn-sm" onclick="addEstCorRow()">+ Adicionar cor</button>
    <div class="ef-hint">Ex: 1 Azul, 2 Verde, 1 Branco — o total é somado automaticamente.</div>
  </div>
  <div class="ef-full"><label class="ef-lbl">Link Fotos (Drive)</label><input class="ef-inp ef-full" id="ee_f" value="${esc(it.fotoUrl||'')}" placeholder="https://drive.google.com/..."></div>
  <div class="ef-full"><label class="ef-lbl">Observações</label><textarea class="ef-inp ef-ta ef-full" id="ee_o" placeholder="Ex: Chegando dia 15/06 · Tem arranhão — pode dar desconto">${esc(it.obs||'')}</textarea></div>
</div>
<div style="display:flex;gap:7px;margin-top:11px;"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-y" onclick="saveEst(${idx})">💾 Salvar</button></div>`);
  renderEstCoresRows();
}
window.novoEst=()=>estModal({},-1);
window.editEst=i=>estModal(estoque.items[i],i);
window.delEst=i=>{if(!confirm('Remover?'))return;estoque.items.splice(i,1);renderAdmEstoque();};
window.saveEst=idx=>{
  const it={
    nome:document.getElementById('ee_n').value.trim(),
    categoria:document.getElementById('ee_c').value,
    coresList:_estCoresDraft.filter(c=>(c.cor&&c.cor.trim())||c.qtde>0).map(c=>({cor:c.cor.trim(),qtde:parseInt(c.qtde)||0})),
    custo:parseBR(document.getElementById('ee_custo').value||'0'),
    status:document.getElementById('ee_s').value,
    fotoUrl:document.getElementById('ee_f').value.trim(),
    obs:document.getElementById('ee_o').value.trim()
  };
  if(!it.nome){toast('Digite o nome','⚠️');return;}
  if(!estoque.items)estoque.items=[];
  if(idx===-1)estoque.items.push(it);else estoque.items[idx]=it;
  closeModal();renderAdmEstoque();
};
window.salvarEst=async()=>await saveFB(dEst,estoque,'Estoque');

/* ADMIN FOTOS */
function renderAdmFotos(){
  const c=document.getElementById('admSub');
  c.innerHTML=`<div class="aviso-edit">✏️ Adicione links do Google Drive com fotos de cada modelo.</div>
  ${Object.entries(FCAT_L).map(([cat,label])=>{
    const isOpen=cat==='patinetes';
    return`<div class="esec" id="afsec_${cat}">
      <div class="esec-h ${isOpen?'open':''}" onclick="toggleE('afsec_${cat}')"><h3>${FCAT_I[cat]} ${esc(label)}</h3><span class="arr" style="${isOpen?'transform:rotate(180deg)':''}">▼</span></div>
      <div class="esec-b ${isOpen?'open':''}" id="afsecb_${cat}">
        ${(fotos[cat]||[]).map((v,i)=>`<div class="adm-row"><div class="ar-info"><div class="ar-name">${esc(v.name)}</div><div class="ar-meta">${v.url?'✅ Link vinculado':'⚠️ Sem link'}</div></div><div class="ar-btns"><button class="btn btn-edit btn-sm" onclick="editFI('${cat}',${i})">✏️</button><button class="btn btn-danger btn-sm" onclick="delFI('${cat}',${i})">🗑</button></div></div>`).join('')}
        <button class="btn-ap" onclick="addFI('${cat}')">+ Modelo</button>
      </div>
    </div>`;
  }).join('')}
  <button class="btn-salvar" onclick="salvarFotos()">☁️ Salvar</button>`;
}
window.editFI=(cat,i)=>{const v=(fotos[cat]||[])[i];if(!v)return;openModal(`<div class="modal-hd"><div class="modal-title">Editar Fotos</div><button class="modal-close" onclick="closeModal()">✕</button></div><div style="margin-bottom:9px;"><label class="ef-lbl">Nome</label><input class="ef-inp" id="ef_n" value="${esc(v.name)}" style="width:100%"></div><div style="margin-bottom:13px;"><label class="ef-lbl">Link Google Drive</label><input class="ef-inp" id="ef_u" value="${esc(v.url||'')}" placeholder="https://drive.google.com/..." style="width:100%"><div class="ef-hint">Pasta compartilhada com fotos do modelo</div></div><div style="display:flex;gap:7px;"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-y" onclick="saveFI('${cat}',${i})">💾 Salvar</button></div>`);};
window.saveFI=(cat,i)=>{if(!fotos[cat])fotos[cat]=[];fotos[cat][i]={...fotos[cat][i],name:document.getElementById('ef_n').value.trim(),url:document.getElementById('ef_u').value.trim()};closeModal();renderAdmFotos();};
window.addFI=cat=>{if(!fotos[cat])fotos[cat]=[];fotos[cat].push({id:uid(),name:'Novo modelo',url:''});renderAdmFotos();};
window.delFI=(cat,i)=>{if(!confirm('Remover?'))return;(fotos[cat]||[]).splice(i,1);renderAdmFotos();};
window.salvarFotos=async()=>await saveFB(dFot,fotos,'Fotos');

/* ADMIN VENDEDORES */
function renderAdmVend(){
  const c=document.getElementById('admSub');const vends=crm.vendedores||[];
  c.innerHTML=`<div class="aviso-edit">✏️ Cadastre os vendedores da equipe.</div>
  <button class="btn btn-y" style="margin-bottom:11px;" onclick="novoVend()">+ Adicionar Vendedor</button>
  <div id="vendsAdmList">
    ${!vends.length?'<div class="empty-state"><div class="empty-icon">👥</div><div class="empty-txt">Nenhum vendedor ainda</div></div>':
    vends.map((v,i)=>{const mL=(crm.leads||[]).filter(l=>l.vendedor===v.id);const f=mL.filter(l=>l.status==='Fechado').length;return`<div class="vend-card"><div><div class="vc-name">👤 ${esc(v.nome)}</div><div class="vc-sub">${mL.length} leads · ${f} fechados · ${mL.length>0?Math.round((f/mL.length)*100):0}% conversão</div></div><div style="display:flex;gap:5px;"><button class="btn btn-edit btn-sm" onclick="editVend(${i})">✏️</button><button class="btn btn-danger btn-sm" onclick="delVend(${i})">🗑</button></div></div>`;}).join('')}
  </div>
  <button class="btn-salvar" style="margin-top:11px;" onclick="salvarVends()">☁️ Salvar</button>`;
}
function vendModal(vend,idx){openModal(`<div class="modal-hd"><div class="modal-title">${idx===-1?'Novo Vendedor':'Editar Vendedor'}</div><button class="modal-close" onclick="closeModal()">✕</button></div><div style="margin-bottom:9px;"><label class="ef-lbl">Nome *</label><input class="ef-inp" id="vn_n" value="${esc(vend.nome||'')}" placeholder="Nome completo" style="width:100%"></div><div style="margin-bottom:14px;"><label class="ef-lbl">Apelido</label><input class="ef-inp" id="vn_a" value="${esc(vend.apelido||'')}" placeholder="Ex: Carol, Igor, Paiolon" style="width:100%"></div><div style="display:flex;gap:7px;"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-y" onclick="saveVend(${idx})">💾 Salvar</button></div>`);}
window.novoVend=()=>vendModal({},-1);
window.editVend=i=>vendModal(crm.vendedores[i],i);
window.delVend=i=>{if(!confirm('Remover?'))return;crm.vendedores.splice(i,1);renderAdmVend();};
window.saveVend=idx=>{const it={nome:document.getElementById('vn_n').value.trim(),apelido:document.getElementById('vn_a').value.trim(),id:idx===-1?('v'+Date.now()):(crm.vendedores[idx]?.id||'v'+Date.now())};if(!it.nome){toast('Digite o nome','⚠️');return;}if(!crm.vendedores)crm.vendedores=[];if(idx===-1)crm.vendedores.push(it);else crm.vendedores[idx]=it;closeModal();renderAdmVend();};
window.salvarVends=async()=>await saveFB(dCRM,crm,'Vendedores');

/* ══ MODAL ══ */
function openModal(html){const bg=document.createElement('div');bg.className='modal-bg';bg.id='modBg';bg.innerHTML=`<div class="modal-box">${html}</div>`;document.getElementById('modals').appendChild(bg);}
window.closeModal=()=>{const b=document.getElementById('modBg');if(b)b.remove();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

/* ══ START ══ */
renderCalc();
init();
</script>
</body>
</html>
