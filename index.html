<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>E-Pulse · App do Vendedor</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ══ RESET & ROOT ══ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --y:#FFD600;--y2:#FFC400;--ydim:rgba(255,214,0,0.12);
  --bg:#F5F4F0;--white:#FFFFFF;--surface:#EEECE8;
  --border:#DDDBD5;--border2:#C8C5BD;
  --text:#1A1915;--text2:#4A4840;--muted:#8A887E;
  --red:#E53E3E;--redl:rgba(229,62,62,0.1);
  --green:#22A559;--greenl:rgba(34,165,89,0.1);
  --orange:#E07B1A;--orangel:rgba(224,123,26,0.1);
  --blue:#2B7FE8;--bluel:rgba(43,127,232,0.1);
  --purple:#7B55D4;--purplel:rgba(123,85,212,0.1);
  --fs:1;
  --font:'Nunito',sans-serif;
  --font2:'Nunito Sans',sans-serif;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;overflow-x:hidden;}

/* ══ FONT SIZE ══ */
body{font-size:calc(15px * var(--fs));}
@media(max-width:480px){body{font-size:calc(14px * var(--fs));}}

/* ══ SCROLLBAR ══ */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--surface);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}

/* ══ LOADING ══ */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:14px;transition:opacity .4s;}
#loading.hide{opacity:0;pointer-events:none;}
.spin{width:38px;height:38px;border:3px solid var(--border);border-top-color:var(--y2);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.load-txt{font-size:0.75em;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:2px;}

/* ══ HEADER ══ */
.app-header{
  background:linear-gradient(135deg,#0C0A04 0%,#221900 40%,#3D1E00 75%,#4A2200 100%);
  border-bottom:2px solid rgba(255,180,0,0.35);
  position:sticky;top:0;z-index:100;
  box-shadow:0 2px 20px rgba(255,100,0,0.18);
}
.header-inner{
  max-width:900px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;gap:10px;flex-wrap:wrap;
}
.logo{display:flex;align-items:center;gap:10px;}
.logo-badge{
  width:36px;height:36px;border-radius:8px;
  background:linear-gradient(135deg,#FFD600,#FF7A00);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:900;color:#111;flex-shrink:0;
  box-shadow:0 2px 8px rgba(255,120,0,0.4);
}
.logo-text .brand{font-size:0.75em;font-weight:900;letter-spacing:3px;text-transform:uppercase;background:linear-gradient(90deg,#FFD600,#FF9500);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.1;}
.logo-text .sub{font-size:0.7em;color:rgba(255,180,0,0.45);font-weight:600;letter-spacing:0.5px;}
.header-right{display:flex;align-items:center;gap:8px;}
.fs-wrap{display:flex;align-items:center;gap:3px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,200,0,0.2);border-radius:8px;padding:3px 6px;}
.fs-btn{width:26px;height:26px;border-radius:5px;border:none;cursor:pointer;background:transparent;color:rgba(255,200,0,0.65);font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;transition:all .15s;user-select:none;line-height:1;}
.fs-btn:hover{color:var(--y2);background:var(--border);}
.fs-lbl{font-size:0.7em;font-weight:700;color:rgba(255,200,0,0.65);min-width:32px;text-align:center;}
.sync-badge{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,200,0,0.2);font-size:0.7em;font-weight:700;color:rgba(255,200,0,0.65);}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .3s;}
.sync-dot.ok{background:var(--green);box-shadow:0 0 5px var(--green);}
.sync-dot.saving{background:var(--y2);animation:sblink .5s infinite;}
.sync-dot.err{background:var(--red);}
@keyframes sblink{0%,100%{opacity:1;}50%{opacity:.3;}}

/* ══ NAV TABS ══ */
.nav-tabs{
  background:var(--white);border-bottom:1px solid var(--border);
  position:sticky;top:62px;z-index:90;
}
.nav-inner{
  max-width:900px;margin:0 auto;
  display:flex;overflow-x:auto;scrollbar-width:none;
}
.nav-inner::-webkit-scrollbar{display:none;}
.nav-tab{
  flex-shrink:0;padding:14px 18px;
  font-size:0.82em;font-weight:700;color:var(--muted);
  background:none;border:none;cursor:pointer;
  border-bottom:3px solid transparent;
  transition:all .18s;white-space:nowrap;
  display:flex;align-items:center;gap:6px;
}
.nav-tab:hover{color:var(--text2);}
.nav-tab.active{color:var(--text);border-bottom-color:var(--y2);}
.nav-tab .nav-icon{font-size:1.1em;}

/* ══ MAIN WRAP ══ */
.main{max-width:900px;margin:0 auto;padding:20px 16px 80px;}

/* ══ SECTION HEADER ══ */
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
.sec-title{font-size:1.05em;font-weight:800;color:var(--text);display:flex;align-items:center;gap:8px;}
.sec-title::before{content:'';display:block;width:4px;height:18px;background:var(--y2);border-radius:2px;}

/* ══ TABS INTERNO ══ */
.cat-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:16px;}
.cat-tabs::-webkit-scrollbar{display:none;}
.cat-tab{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--white);color:var(--muted);font-size:0.8em;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap;}
.cat-tab.active{background:var(--y);border-color:var(--y2);color:#111;}
.cat-tab:not(.active):hover{border-color:var(--y2);color:var(--text);}

/* ══ CARD BASE ══ */
.card{background:var(--white);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.card-pad{padding:16px;}

/* ══ CALCULADORA ══ */
.calc-input-card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;}
.calc-label{font-size:0.72em;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:8px;display:block;}
.valor-row{display:flex;gap:8px;align-items:stretch;}
.val-prefix{background:var(--y);color:#111;font-weight:900;font-size:1.1em;padding:0 14px;border-radius:9px;display:flex;align-items:center;flex-shrink:0;letter-spacing:-0.5px;}
.val-input{
  flex:1;background:var(--bg);border:2px solid var(--border);border-radius:9px;
  padding:12px 14px;font-family:var(--font);font-size:1.4em;font-weight:900;
  color:var(--text);outline:none;transition:border-color .18s;min-width:0;
}
.val-input:focus{border-color:var(--y2);}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin-top:12px;max-height:200px;overflow-y:auto;}
.prod-btn{
  background:var(--bg);border:1.5px solid var(--border);border-radius:9px;
  padding:9px 10px;cursor:pointer;text-align:left;transition:all .13s;
}
.prod-btn:active,.prod-btn.sel{border-color:var(--y2);background:var(--ydim);}
.pnome{font-size:0.78em;font-weight:700;color:var(--text2);display:block;line-height:1.3;margin-bottom:3px;}
.ppreco{font-size:0.88em;font-weight:900;color:var(--y2);}

/* RESULTADO TABELA CALC */
.result-card{background:var(--white);border:1.5px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06);}
.rc-header{background:var(--text);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.rc-brand{font-size:0.65em;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--y);}
.rc-name{font-size:0.9em;font-weight:800;color:#fff;margin-top:2px;}
.rc-recebe .rl{font-size:0.65em;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px;}
.rc-recebe .rv{font-size:1.2em;font-weight:900;color:var(--y);}
.rc-subheader{background:var(--y);padding:8px 16px;font-size:0.78em;font-weight:900;color:#111;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--y2);}
.calc-table-outer{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.calc-table{width:100%;border-collapse:collapse;min-width:360px;}
.calc-table thead tr{background:var(--text);}
.calc-table thead th{padding:8px 10px;font-size:0.68em;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--y);text-align:right;}
.calc-table thead th:first-child{text-align:center;}
.calc-table tbody tr:nth-child(odd){background:#FFF9DC;}
.calc-table tbody tr:nth-child(even){background:var(--ydim);}
.calc-table tbody tr.dest-row{background:var(--text);}
.calc-table tbody td{padding:8px 10px;text-align:right;font-size:0.88em;font-weight:600;color:var(--text);}
.calc-table tbody tr.dest-row td{color:var(--y);}
.calc-table tbody td:first-child{text-align:center;font-size:0.82em;font-weight:900;}
.tv-c{font-weight:900;font-size:0.95em;}
.tv-p{font-weight:700;}
.tv-l{font-size:0.8em;opacity:.7;}
.rc-footer{background:var(--text);padding:8px 16px;text-align:center;font-size:0.65em;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#555;}
.rc-footer b{color:var(--y);}
.empty-calc{text-align:center;padding:32px 20px;color:var(--muted);font-size:0.9em;font-weight:600;}

/* ══ TABELA DE PREÇOS ══ */
.preco-card{background:var(--white);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:12px;}
.preco-header{background:var(--text);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;}
.preco-header .ph-title{font-size:0.75em;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--y);}
.preco-table-outer{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.preco-table{width:100%;border-collapse:collapse;font-size:0.85em;min-width:500px;}
.preco-table thead tr{background:#F0EDE6;}
.preco-table thead th{padding:9px 12px;text-align:center;font-size:0.72em;font-weight:800;text-transform:uppercase;letter-spacing:0.8px;color:var(--muted);white-space:nowrap;}
.preco-table thead th:first-child{text-align:left;}
.preco-table tbody tr{border-bottom:1px solid var(--border);}
.preco-table tbody tr:last-child{border-bottom:none;}
.preco-table tbody tr:hover{background:var(--ydim);}
.preco-table tbody td{padding:10px 12px;text-align:center;color:var(--text2);font-weight:600;}
.preco-table tbody td:first-child{text-align:left;font-weight:700;color:var(--text);}
.preco-table .p-avista{font-weight:900;color:var(--green);}
.preco-table .p-parc{color:var(--text);}
.preco-table .p-tot{font-size:0.8em;color:var(--muted);}
.preco-table .p-min{color:var(--purple);font-weight:700;}
/* Botão cálculo rápido */
.preco-table .calc-btn{
  background:var(--ydim);border:1px solid var(--y2);color:var(--y2);
  border-radius:6px;padding:3px 8px;font-size:0.72em;font-weight:700;
  cursor:pointer;transition:all .15s;white-space:nowrap;
}
.preco-table .calc-btn:hover{background:var(--y);color:#111;}

/* SECTION DIVIDER */
.section-cat{font-size:0.72em;font-weight:900;text-transform:uppercase;letter-spacing:2px;color:var(--muted);padding:14px 16px 8px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.section-cat::before{content:'';display:block;width:3px;height:12px;background:var(--y2);border-radius:2px;}

/* ══ ESTOQUE ══ */
.estoque-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
.estoque-card{background:var(--white);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:box-shadow .18s;}
.estoque-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.08);}
.ec-top{padding:14px 14px 10px;border-bottom:1px solid var(--border);}
.ec-name{font-size:0.9em;font-weight:800;color:var(--text);margin-bottom:4px;}
.ec-cat{font-size:0.68em;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
.ec-body{padding:12px 14px;}
.ec-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px;}
.ec-row:last-child{margin-bottom:0;}
.ec-label{font-size:0.72em;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);}
.ec-value{font-size:0.85em;font-weight:700;color:var(--text);}
/* STATUS BADGES */
.status-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:0.72em;font-weight:700;}
.s-disponivel{background:var(--greenl);color:var(--green);}
.s-poucos{background:var(--orangel);color:var(--orange);}
.s-indisponivel{background:var(--redl);color:var(--red);}
.s-chegando{background:var(--bluel);color:var(--blue);}
.s-promo{background:var(--purplel);color:var(--purple);}
/* CORES DOTS */
.cores-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;}
.cor-dot{
  width:20px;height:20px;border-radius:50%;
  border:2px solid rgba(0,0,0,.12);
  cursor:default;flex-shrink:0;
  position:relative;
}
.cor-dot[title]:hover::after{
  content:attr(title);position:absolute;top:calc(100% + 4px);left:50%;
  transform:translateX(-50%);background:var(--text);color:#fff;
  font-size:10px;padding:2px 6px;border-radius:4px;white-space:nowrap;z-index:10;pointer-events:none;
}
/* QTDE */
.qtde-badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:28px;height:28px;border-radius:8px;
  font-size:0.9em;font-weight:900;
}
.qtde-0{background:var(--redl);color:var(--red);}
.qtde-few{background:var(--orangel);color:var(--orange);}
.qtde-ok{background:var(--greenl);color:var(--green);}
/* OBS */
.ec-obs{
  margin:8px 14px 12px;padding:8px 10px;
  background:var(--surface);border-radius:8px;border-left:3px solid var(--y2);
  font-size:0.78em;color:var(--text2);line-height:1.5;
}
/* FOTOS LINK */
.ec-foto-btn{
  display:flex;align-items:center;gap:6px;
  width:100%;padding:9px 14px;
  background:var(--ydim);border:none;border-top:1px solid var(--border);
  color:var(--y2);font-size:0.78em;font-weight:700;cursor:pointer;
  transition:background .15s;text-decoration:none;
}
.ec-foto-btn:hover{background:#FFF3B0;}

/* ══ MANUAIS ══ */
.manual-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;transition:border-color .15s;}
.manual-card.has-pdf{cursor:pointer;}
.manual-card.has-pdf:hover{border-color:var(--y2);}
.mc-info .mc-name{font-size:0.9em;font-weight:700;color:var(--text);margin-bottom:3px;}
.mc-info .mc-cat{font-size:0.7em;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);}
.mc-icon{
  width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1.1em;
}
.mc-icon.has{background:var(--ydim);}
.mc-icon.no{background:var(--surface);}

/* ══ ADMIN / EDIT PANEL ══ */
.admin-login{display:flex;align-items:center;justify-content:center;min-height:60vh;}
.login-box{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:32px 28px;width:100%;max-width:360px;text-align:center;}
.login-icon{width:52px;height:52px;background:var(--y);border-radius:12px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:1.4em;}
.login-title{font-size:1.2em;font-weight:900;margin-bottom:4px;}
.login-sub{font-size:0.82em;color:var(--muted);margin-bottom:20px;}
.login-input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:9px;background:var(--bg);font-family:var(--font);font-size:0.95em;color:var(--text);outline:none;margin-bottom:8px;}
.login-input:focus{border-color:var(--y2);}
.login-err{font-size:0.78em;color:var(--red);min-height:18px;margin-bottom:6px;}

/* ADMIN TABS */
.admin-tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--surface);border-radius:10px;padding:4px;width:fit-content;}
.admin-tab{padding:7px 16px;border-radius:8px;border:none;cursor:pointer;font-family:var(--font);font-weight:700;font-size:0.82em;background:transparent;color:var(--muted);transition:all .15s;}
.admin-tab.active{background:var(--y);color:#111;}

/* ADMIN FORMS */
.esec{background:var(--white);border-radius:12px;border:1px solid var(--border);margin-bottom:12px;overflow:hidden;}
.esec-h{background:var(--surface);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;}
.esec-h h3{font-size:0.8em;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--text2);}
.esec-h .arr{font-size:11px;color:var(--muted);transition:transform .2s;display:inline-block;}
.esec-h.open .arr{transform:rotate(180deg);}
.esec-b{padding:14px;display:none;}
.esec-b.open{display:block;}
.aviso-edit{background:var(--ydim);border:1px solid var(--y2);border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:0.82em;color:var(--text2);line-height:1.7;}
.aviso-edit b{color:var(--y2);}

.cat-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;background:var(--bg);border-radius:8px;padding:9px 11px;border:1px solid var(--border);}
.cat-icon{font-size:14px;flex-shrink:0;}
input.cat-name{flex:1;font-size:0.9em;font-weight:800;background:transparent;border:none;color:var(--text);font-family:var(--font);outline:none;min-width:0;}
input.cat-name:focus{border-bottom:1.5px solid var(--y2);}
.btn-dc{background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:0 3px;flex-shrink:0;}

.prod-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;background:var(--bg);border-radius:8px;padding:8px 10px;border:1px solid var(--border);}
input.pn{flex:2;font-size:0.85em;font-weight:600;background:transparent;border:none;color:var(--text);font-family:var(--font);outline:none;min-width:0;}
input.pn:focus{border-bottom:1px solid var(--y2);}
.sep2{color:var(--border2);font-size:13px;flex-shrink:0;}
input.pv{width:80px;font-size:0.9em;font-weight:900;background:transparent;border:none;color:var(--y2);font-family:var(--font);outline:none;text-align:right;flex-shrink:0;}
input.pv:focus{border-bottom:1px solid var(--y2);}
.btn-dp{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:0 2px;flex-shrink:0;}
.btn-dp:hover{color:var(--red);}
.btn-ap{width:100%;padding:8px;border-radius:8px;border:1.5px dashed var(--border2);background:transparent;color:var(--muted);font-family:var(--font);font-size:0.8em;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:1px;margin-top:5px;}
.btn-ac{width:100%;padding:10px;border-radius:10px;border:1.5px dashed var(--border2);background:transparent;color:var(--muted);font-family:var(--font);font-size:0.8em;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;}
.hr-c{border:none;border-top:1px solid var(--border);margin:12px 0;}
.ti{font-size:0.8em;color:var(--muted);margin-bottom:10px;line-height:1.6;}
.taxa-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;background:var(--bg);border-radius:8px;padding:7px 11px;border:1px solid var(--border);}
.tx-l{font-size:0.8em;font-weight:800;color:var(--muted);width:34px;flex-shrink:0;}

.tx-u{font-size:0.8em;color:var(--muted);flex-shrink:0;}

.estoque-form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.ef-full{grid-column:1/-1;}
.ef-label{font-size:0.72em;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);display:block;margin-bottom:4px;}
.ef-input{width:100%;padding:9px 11px;border:1.5px solid var(--border);border-radius:8px;background:var(--bg);font-family:var(--font);font-size:0.88em;color:var(--text);outline:none;transition:border-color .16s;}
.ef-input:focus{border-color:var(--y2);}
.ef-select{background:var(--white);}
.ef-textarea{min-height:60px;resize:vertical;}
.ef-hint{font-size:0.7em;color:var(--muted);margin-top:3px;}

.estoque-row{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:8px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.er-info{flex:1;}
.er-name{font-size:0.88em;font-weight:700;color:var(--text);margin-bottom:3px;}
.er-meta{font-size:0.72em;color:var(--muted);}
.er-btns{display:flex;gap:6px;flex-shrink:0;}

.preco-admin-row{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}

.par-price-item.pmin b{color:var(--purple);}

.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:9px;font-family:var(--font);font-size:0.85em;font-weight:700;cursor:pointer;border:none;transition:all .16s;}
.btn-y{background:var(--y);color:#111;}
.btn-y:hover{background:var(--y2);}

.btn-ghost2{background:var(--surface);color:var(--text2);border:1px solid var(--border);}

.btn-sm2{padding:5px 10px;font-size:0.75em;}
.btn-full{width:100%;}
.btn-salvar{width:100%;padding:13px;border-radius:10px;border:none;background:var(--y);color:#111;font-family:var(--font);font-size:0.95em;font-weight:900;cursor:pointer;text-transform:uppercase;letter-spacing:2px;margin-top:4px;}

/* ══ TOAST ══ */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--text);color:#fff;padding:11px 22px;border-radius:50px;font-size:0.8em;font-weight:700;letter-spacing:.5px;transition:transform .28s cubic-bezier(.34,1.56,.64,1);z-index:9999;pointer-events:none;white-space:nowrap;display:flex;align-items:center;gap:7px;}
#toast.show{transform:translateX(-50%) translateY(0);}
#toast .t-icon{font-size:1.1em;}

/* ══ MODAL ══ */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px);}

.empty-txt{font-size:0.9em;font-weight:600;}

      if(salvando) return;
      if(snap.exists()){const d=snap.data();taxas=d.taxas||TAXAS_DEFAULT;cats=d.cats||CATS_DEFAULT;}
      else setDoc(docCalc,{taxas:TAXAS_DEFAULT,cats:CATS_DEFAULT});
      if(!loaded){loaded=true;hideLoading();setSync('ok','Online');}
      if(currentTab==='calc') renderCalc();
      if(currentTab==='admin') renderAdminContent();
    }, ()=>{hideLoading();setSync('err','Offline');});

    // Precos
    getDoc(docPrecos).then(s=>{
      if(s.exists()) precos=s.data();
      else setDoc(docPrecos,PRECOS_DEFAULT);
      if(currentTab==='tabela') renderTabela();
    });

    // Estoque
    onSnapshot(docEstoque, s=>{
      if(s.exists()) estoque=s.data();
      else setDoc(docEstoque,ESTOQUE_DEFAULT);
      if(currentTab==='estoque') renderEstoque();
    });

    // Manuais
    getDoc(docManuais).then(s=>{
      if(s.exists()) manuais=s.data();
      else setDoc(docManuais,MANUAIS_DEFAULT);
      if(currentTab==='manuais') renderManuais();
    });

  } catch(e){hideLoading();setSync('err','Erro');}
}

function calcParc(avista,parcelas){
  const taxa=taxas.find(t=>t.p===parcelas);
  if(!taxa) return {cobrar:0,parc:0};
  const cobrar=avista/(1-taxa.j/100);
  return{cobrar,parc:cobrar/parcelas};
}

    if(inp.classList.contains('pn')) cats[ci].prods[pi].n=inp.value;
    if(inp.classList.contains('pv')) cats[ci].prods[pi].v=parseBR(inp.value);
  });
  document.querySelectorAll('[data-cn]').forEach(inp=>{const ci=+inp.dataset.cn;if(cats[ci])cats[ci].nome=inp.value;});
}

function renderEditProds(){
  const body=document.getElementById('aBodyP');if(!body)return;
  body.innerHTML='';
  cats.forEach((cat,ci)=>{
    const cRow=document.createElement('div');cRow.className='cat-row';
    cRow.innerHTML=`<span class="cat-icon">📁</span><input class="cat-name" type="text" value="${esc(cat.nome)}" placeholder="Nome da categoria" data-cn="${ci}"><button class="btn-dc" data-dc="${ci}">🗑️</button>`;
    body.appendChild(cRow);
    const pd=document.createElement('div');pd.style.paddingLeft='6px';
    cat.prods.forEach((p,pi)=>{
      const r=document.createElement('div');r.className='prod-row';
      r.innerHTML=`<input class="pn" type="text" value="${esc(p.n)}" placeholder="Nome" data-ci="${ci}" data-pi="${pi}"><span class="sep2">·</span><input class="pv" type="text" value="${f2(p.v)}" placeholder="0,00" inputmode="decimal" data-ci="${ci}" data-pi="${pi}"><button class="btn-dp" data-dp="${ci}-${pi}">✕</button>`;
      pd.appendChild(r);
    });
    const ap=document.createElement('button');ap.className='btn-ap';ap.textContent='+ Adicionar produto';ap.setAttribute('data-ap',ci);
    pd.appendChild(ap);body.appendChild(pd);
    if(ci<cats.length-1){const hr=document.createElement('hr');hr.className='hr-c';body.appendChild(hr);}
  });
  const ac=document.createElement('button');ac.className='btn-ac';ac.id='btnAC2';ac.textContent='+ Adicionar nova categoria';
  body.appendChild(ac);
  body.onclick=e=>{
    const dc=e.target.closest('[data-dc]'),dp=e.target.closest('[data-dp]'),ap=e.target.closest('[data-ap]'),ac=e.target.closest('#btnAC2');
    if(dc){lerInputs();const ci=+dc.dataset.dc;if(!confirm(`Remover "${cats[ci].nome}"?`))return;cats.splice(ci,1);if(!cats.find(c=>c.id===catAtual))catAtual=cats[0]?.id||'sc';renderEditProds();}
    if(dp){lerInputs();const[ci,pi]=dp.dataset.dp.split('-').map(Number);cats[ci].prods.splice(pi,1);renderEditProds();}
    if(ap){lerInputs();const ci=+ap.dataset.ap;cats[ci].prods.push({n:'Novo produto',v:0});renderEditProds();}
    if(ac){lerInputs();cats.push({id:'c'+Date.now(),nome:'Nova categoria',prods:[]});renderEditProds();}
  };
}

function renderEditTaxas(){
  const body=document.getElementById('aBodyT');if(!body)return;
  body.innerHTML='<p class="ti">Edite a taxa (%) conforme sua operadora de cartão.</p>';
  taxas.forEach((t,i)=>{
    const r=document.createElement('div');r.className='taxa-row';
    r.innerHTML=`<span class="tx-l">${t.p}x</span><input class="tv" type="text" value="${t.j.toFixed(2)}" inputmode="decimal" data-ti="${i}"><span class="tx-u">%</span>`;
    body.appendChild(r);
  });
  body.querySelectorAll('.tv').forEach(inp=>{inp.addEventListener('change',()=>{taxas[+inp.dataset.ti].j=parseFloat(inp.value.replace(',','.'))||0;});});
}

window.salvarCalc=async()=>{
  lerInputs();
  document.querySelectorAll('.tv').forEach(inp=>{taxas[+inp.dataset.ti].j=parseFloat(inp.value.replace(',','.'))||0;});
  salvando=true;setSync('saving','Salvando...');
  try{await setDoc(docCalc,{taxas,cats});setSync('ok','Salvo!');toast('Calculadora salva!');}
  catch(e){setSync('err','Erro');toast('Erro ao salvar','❌');}
  salvando=false;
};

/* ADMIN PREÇOS */
function renderAdminPrecos(){
  const c=document.getElementById('adminSubContent');
  const secs=precos.secoes||[];
  c.innerHTML=`
    <div class="aviso-edit">✏️ Edite a tabela de preços. Clique em <b>Salvar</b> ao terminar.</div>
    <div id="precosAdminBody">
      ${secs.map((sec,si)=>`
        <div class="esec" id="psec-${si}">
          <div class="esec-h ${si===0?'open':''}" onclick="toggleEsec('psec-${si}')">
            <h3>${sec.nome}</h3><span class="arr ${si===0?'open':''}">▼</span>
          </div>
          <div class="esec-b ${si===0?'open':''}" id="psecb-${si}">
            ${(sec.items||[]).map((item,ii)=>`
              <div class="preco-admin-row" id="par-${si}-${ii}">
                <div class="par-name">${esc(item.n)}</div>
                <div class="par-prices">
                  <span class="par-price-item">À vista: <b>${fmt(item.avista)}</b></span>
                  <span class="par-price-item pmin">Mínimo: <b>${fmt(item.min||item.avista)}</b></span>
                </div>
                <div style="display:flex;gap:6px;">
                  <button class="btn btn-edit2 btn-sm2" onclick="editPrecoItem(${si},${ii})">✏️ Editar</button>
                  <button class="btn btn-danger2 btn-sm2" onclick="delPrecoItem(${si},${ii})">🗑</button>
                </div>
              </div>
            `).join('')}
            <button class="btn-ap" onclick="addPrecoItem(${si})">+ Adicionar produto à ${esc(sec.nome)}</button>
          </div>
        </div>
      `).join('')}
      <button class="btn-ac" onclick="addPrecoSec()">+ Adicionar nova seção</button>
    </div>
    <button class="btn-salvar" onclick="salvarPrecos()">☁️ Salvar Tabela de Preços</button>
  `;
}

window.editPrecoItem=(si,ii)=>{
  const item=precos.secoes[si].items[ii];
  openModal(`
    <div class="modal-hd">
      <div class="modal-title">Editar Preço</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="estoque-form-row ef-full">
      <label class="ef-label">Nome do Modelo</label>
      <input class="ef-input ef-full" id="ep_nome" type="text" value="${esc(item.n)}">
    </div>
    <div class="estoque-form-row" style="margin-top:10px;">
      <div>
        <label class="ef-label">Preço À Vista (R$)</label>
        <input class="ef-input" id="ep_avista" type="text" value="${f2(item.avista)}" inputmode="decimal">
      </div>
      <div>
        <label class="ef-label">Preço Mínimo (R$)</label>
        <input class="ef-input" id="ep_min" type="text" value="${f2(item.min||item.avista)}" inputmode="decimal">
        <span class="ef-hint">O menor valor que pode ser vendido</span>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="btn btn-ghost2" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-y" onclick="savePrecoItem(${si},${ii})">💾 Salvar</button>
    </div>
  `);
};

window.savePrecoItem=(si,ii)=>{
  precos.secoes[si].items[ii]={
    n:document.getElementById('ep_nome').value.trim(),
    avista:parseBR(document.getElementById('ep_avista').value),
    min:parseBR(document.getElementById('ep_min').value)
  };
  closeModal();renderAdminPrecos();
};

window.delPrecoItem=(si,ii)=>{if(!confirm('Remover?'))return;precos.secoes[si].items.splice(ii,1);renderAdminPrecos();};

window.addPrecoItem=si=>{
  precos.secoes[si].items.push({n:'Novo modelo',avista:0,min:0});
  renderAdminPrecos();
};

window.addPrecoSec=()=>{
  precos.secoes.push({nome:'Nova Seção',items:[]});
  renderAdminPrecos();
};

window.salvarPrecos=async()=>{
  salvando=true;setSync('saving','Salvando...');
  try{await setDoc(docPrecos,precos);setSync('ok','Salvo!');toast('Tabela de preços salva!');}
  catch(e){setSync('err','Erro');toast('Erro ao salvar','❌');}
  salvando=false;
};

/* ADMIN ESTOQUE */
function renderAdminEstoque(){
  const c=document.getElementById('adminSubContent');
  const items=estoque.items||[];
  c.innerHTML=`
    <div class="aviso-edit">✏️ Gerencie o estoque: quantidade, cores disponíveis, status e observações.</div>
    <button class="btn btn-y" style="margin-bottom:14px;" onclick="abrirNovoEstoque()">+ Adicionar Modelo ao Estoque</button>
    <div id="estoqueAdminList">
      ${!items.length?'<div class="empty-state"><div class="empty-icon">📦</div><div class="empty-txt">Nenhum item ainda</div></div>':
      items.map((it,i)=>`
        <div class="estoque-row" id="er-${i}">
          <div class="er-info">
            <div class="er-name">${esc(it.nome)}</div>
            <div class="er-meta">${esc(it.categoria||'')} · Qtde: ${it.qtde||0} · ${it.status||'Disponível'}${it.cores?` · Cores: ${esc(it.cores)}`:''}</div>
            ${it.obs?`<div style="font-size:0.75em;color:var(--muted);margin-top:3px;">📝 ${esc(it.obs)}</div>`:''}
          </div>
          <div class="er-btns">
            <button class="btn btn-edit2 btn-sm2" onclick="editEstoqueItem(${i})">✏️</button>
            <button class="btn btn-danger2 btn-sm2" onclick="delEstoqueItem(${i})">🗑</button>
          </div>
        </div>
      `).join('')}
    </div>
    <button class="btn-salvar" style="margin-top:14px;" onclick="salvarEstoque()">☁️ Salvar Estoque</button>
  `;
}

function estoqueModal(item,idx){
  const isNew=idx===-1;
  openModal(`
    <div class="modal-hd">
      <div class="modal-title">${isNew?'Novo Item no Estoque':'Editar Estoque'}</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="estoque-form-row ef-full" style="margin-bottom:10px;">
      <label class="ef-label">Nome do Modelo *</label>
      <input class="ef-input ef-full" id="ee_nome" type="text" placeholder="Ex: Torino 1000W" value="${esc(item.nome||'')}">
    </div>
    <div class="estoque-form-row">
      <div>
        <label class="ef-label">Categoria</label>
        <select class="ef-input ef-select" id="ee_cat">
          ${['Scooter','Bike Elétrica','Patinete','Outro'].map(c=>`<option${(item.categoria||'')==c?' selected':''}>${c}</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="ef-label">Quantidade em Estoque</label>
        <input class="ef-input" id="ee_qtde" type="number" min="0" value="${item.qtde||0}">
      </div>
    </div>
    <div style="margin-top:10px;">
      <label class="ef-label">Status</label>
      <select class="ef-input ef-select" id="ee_status">
        ${STATUS_OPTS.map(s=>`<option${(item.status||'Disponível')===s?' selected':''}>${s}</option>`).join('')}
      </select>
    </div>
    <div style="margin-top:10px;">
      <label class="ef-label">Cores Disponíveis (separar por vírgula)</label>
      <input class="ef-input" id="ee_cores" type="text" placeholder="Ex: preto, branco, vermelho" value="${esc(item.cores||'')}">
      <span class="ef-hint">Cores: preto, branco, cinza, vermelho, azul, verde, amarelo, laranja, roxo, rosa, grafite, prata, dourado</span>
    </div>
    <div style="margin-top:10px;">
      <label class="ef-label">Link de Fotos (Google Drive)</label>
      <input class="ef-input" id="ee_foto" type="text" placeholder="https://drive.google.com/..." value="${esc(item.fotoUrl||'')}">
    </div>
    <div style="margin-top:10px;">
      <label class="ef-label">Observações</label>
      <textarea class="ef-input ef-textarea" id="ee_obs" placeholder="Ex: Chegando dia 15/06 · Tem arranhão na lateral — pode dar desconto">${esc(item.obs||'')}</textarea>
    </div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="btn btn-ghost2" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-y" onclick="saveEstoqueItem(${idx})">💾 Salvar</button>
    </div>
  `);
}

window.abrirNovoEstoque=()=>estoqueModal({},- 1);
window.editEstoqueItem=i=>estoqueModal(estoque.items[i],i);
window.delEstoqueItem=i=>{if(!confirm('Remover este item?'))return;estoque.items.splice(i,1);renderAdminEstoque();};
window.saveEstoqueItem=idx=>{
  const it={
    nome:document.getElementById('ee_nome').value.trim(),
    categoria:document.getElementById('ee_cat').value,
    qtde:parseInt(document.getElementById('ee_qtde').value)||0,
    status:document.getElementById('ee_status').value,
    cores:document.getElementById('ee_cores').value.trim(),
    fotoUrl:document.getElementById('ee_foto').value.trim(),
    obs:document.getElementById('ee_obs').value.trim()
  };
  if(!it.nome){toast('Digite o nome do modelo','⚠️');return;}
  if(!estoque.items) estoque.items=[];
  if(idx===-1) estoque.items.push(it);
  else estoque.items[idx]=it;
  closeModal();renderAdminEstoque();
};

window.salvarEstoque=async()=>{
  salvando=true;setSync('saving','Salvando...');
  try{await setDoc(docEstoque,estoque);setSync('ok','Salvo!');toast('Estoque salvo!');}
  catch(e){setSync('err','Erro');toast('Erro ao salvar','❌');}
  salvando=false;
};

/* ADMIN MANUAIS */
function renderAdminManuais(){
  const c=document.getElementById('adminSubContent');
  const allItems=Object.entries(manuais).flatMap(([cat,items])=>(items||[]).map(v=>({...v,category:cat})));
  c.innerHTML=`
    <div class="aviso-edit">✏️ Adicione e edite links de manuais do Google Drive.</div>
    ${Object.entries(CAT_LABELS).map(([cat,label])=>`
      <div class="esec" id="msec-${cat}">
        <div class="esec-h ${cat==='patinetes'?'open':''}" onclick="toggleEsec('msec-${cat}')">
          <h3>${CAT_ICONS[cat]} ${label}</h3><span class="arr ${cat==='patinetes'?'open':''}">▼</span>
        </div>
        <div class="esec-b ${cat==='patinetes'?'open':''}" id="msecb-${cat}">
          ${(manuais[cat]||[]).map((v,i)=>`
            <div class="estoque-row" id="mr-${cat}-${i}">
              <div class="er-info">
                <div class="er-name">${esc(v.name)}</div>
                <div class="er-meta">${v.pdfUrl?'✅ PDF vinculado':'⚠️ Sem PDF ainda'}</div>
              </div>
              <div class="er-btns">
                <button class="btn btn-edit2 btn-sm2" onclick="editManualItem('${cat}',${i})">✏️</button>
                <button class="btn btn-danger2 btn-sm2" onclick="delManualItem('${cat}',${i})">🗑</button>
              </div>
            </div>
          `).join('')}
          <button class="btn-ap" onclick="addManualItem('${cat}')">+ Adicionar modelo à ${esc(label)}</button>
        </div>
      </div>
    `).join('')}
    <button class="btn-salvar" onclick="salvarManuais()">☁️ Salvar Manuais</button>
  `;
}

window.editManualItem=(cat,i)=>{
  const v=(manuais[cat]||[])[i];if(!v)return;
  openModal(`
    <div class="modal-hd">
      <div class="modal-title">Editar Manual</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div style="margin-bottom:10px;">
      <label class="ef-label">Nome do Modelo</label>
      <input class="ef-input ef-full" id="em_nome" value="${esc(v.name)}">
    </div>
    <div style="margin-bottom:16px;">
      <label class="ef-label">Link Google Drive</label>
      <input class="ef-input ef-full" id="em_url" placeholder="https://drive.google.com/file/d/..." value="${esc(v.pdfUrl||'')}">
      <span class="ef-hint">Compartilhamento: "Qualquer pessoa com o link pode visualizar"</span>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-ghost2" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-y" onclick="saveManualItem('${cat}',${i})">💾 Salvar</button>
    </div>
  `);
};

window.saveManualItem=(cat,i)=>{
  if(!manuais[cat]) manuais[cat]=[];
  manuais[cat][i]={...manuais[cat][i],name:document.getElementById('em_nome').value.trim(),pdfUrl:document.getElementById('em_url').value.trim()};
  closeModal();renderAdminManuais();
};

window.addManualItem=cat=>{
  if(!manuais[cat]) manuais[cat]=[];
  manuais[cat].push({id:uid(),name:'Novo modelo',pdfUrl:''});
  renderAdminManuais();
};

window.delManualItem=(cat,i)=>{if(!confirm('Remover?'))return;(manuais[cat]||[]).splice(i,1);renderAdminManuais();};

window.salvarManuais=async()=>{
  salvando=true;setSync('saving','Salvando...');
  try{await setDoc(docManuais,manuais);setSync('ok','Salvo!');toast('Manuais salvos!');}
  catch(e){setSync('err','Erro');toast('Erro ao salvar','❌');}
  salvando=false;
};

/* ══ MODAL ══ */
function openModal(html){
  const bg=document.createElement('div');bg.className='modal-bg';bg.id='modalBg';
  bg.innerHTML=`<div class="modal-box">${html}</div>`;
  document.getElementById('modalContainer').appendChild(bg);
}
window.closeModal=()=>{const bg=document.getElementById('modalBg');if(bg)bg.remove();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

/* ══ START ══ */
renderCalc();
init();
</script>
