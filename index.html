<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>E-Pulse · App do Vendedor</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --y:#FFD600;--y2:#FFC400;--ydim:rgba(255,214,0,0.12);
  --org:#FF7A00;--org2:#FF9500;
  --bg:#F5F4F0;--white:#FFFFFF;--surface:#EEECE8;--card:#FFFFFF;
  --border:#DDDBD5;--border2:#C8C5BD;
  --text:#1A1915;--text2:#4A4840;--muted:#8A887E;
  --red:#E53E3E;--redl:rgba(229,62,62,0.1);
  --green:#1E9E50;--greenl:rgba(30,158,80,0.1);
  --orange:#E07B1A;--orangel:rgba(224,123,26,0.1);
  --blue:#2B7FE8;--bluel:rgba(43,127,232,0.1);
  --purple:#7B55D4;--purplel:rgba(123,85,212,0.1);
  --fs:1; --fn:'Nunito',sans-serif;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--fn);min-height:100vh;overflow-x:hidden;}
body{font-size:calc(14px * var(--fs));}
@media(max-width:480px){body{font-size:calc(13px * var(--fs));}}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:var(--surface);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
::-webkit-scrollbar-thumb:hover{background:var(--y2);}

#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:14px;transition:opacity .4s;}
#loading.hide{opacity:0;pointer-events:none;}
.spin{width:36px;height:36px;border:3px solid var(--border2);border-top-color:var(--y2);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.load-brand{font-size:1.3em;font-weight:900;color:var(--y2);letter-spacing:2px;}
.load-txt{font-size:0.7em;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:2px;}

/* HEADER */
.app-header{
  background:linear-gradient(135deg,#0C0A04 0%,#221900 40%,#3D1E00 70%,#4A2200 100%);
  border-bottom:2px solid rgba(255,180,0,0.3);
  position:sticky;top:0;z-index:100;
  box-shadow:0 2px 20px rgba(255,100,0,0.18);
}
.header-inner{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:11px 16px;gap:10px;flex-wrap:wrap;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-badge{width:34px;height:34px;border-radius:8px;flex-shrink:0;background:linear-gradient(135deg,#FFD600,#FF7A00);display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 2px 8px rgba(255,120,0,0.4);}
.logo-text .brand{font-size:0.8em;font-weight:900;letter-spacing:2px;text-transform:uppercase;background:linear-gradient(90deg,#FFD600,#FF9500);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.1;}
.logo-text .sub{font-size:0.64em;color:rgba(255,180,0,0.45);font-weight:600;}
.header-right{display:flex;align-items:center;gap:7px;}
.fs-wrap{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,200,0,0.2);border-radius:8px;padding:3px 5px;}
.fs-btn{width:24px;height:24px;border-radius:5px;border:none;cursor:pointer;background:transparent;color:rgba(255,200,0,0.65);font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center;transition:all .15s;user-select:none;}
.fs-btn:hover{color:var(--y);background:rgba(255,200,0,0.1);}
.fs-lbl{font-size:0.67em;font-weight:700;color:rgba(255,200,0,0.6);min-width:30px;text-align:center;}
.sync-badge{display:flex;align-items:center;gap:5px;padding:5px 9px;border-radius:7px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,200,0,0.15);font-size:0.68em;font-weight:700;color:rgba(255,200,0,0.55);}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .3s;}
.sync-dot.ok{background:var(--green);box-shadow:0 0 5px var(--green);}
.sync-dot.saving{background:var(--y);animation:sblink .5s infinite;}
.sync-dot.err{background:var(--red);}
@keyframes sblink{0%,100%{opacity:1;}50%{opacity:.25;}}

/* NAV */
.nav-tabs{background:var(--white);border-bottom:2px solid var(--border);position:sticky;top:58px;z-index:90;}
.nav-inner{max-width:960px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none;}
.nav-inner::-webkit-scrollbar{display:none;}
.nav-tab{flex-shrink:0;padding:12px 15px;font-size:0.77em;font-weight:700;color:var(--muted);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .18s;white-space:nowrap;font-family:var(--fn);}
.nav-tab:hover{color:var(--text2);}
.nav-tab.active{color:var(--text);border-bottom-color:var(--y2);}

/* MAIN */
.main{max-width:960px;margin:0 auto;padding:16px 14px 80px;}

/* SEC HD */
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;gap:10px;flex-wrap:wrap;}
.sec-title{font-size:1em;font-weight:800;color:var(--text);display:flex;align-items:center;gap:8px;}
.sec-title::before{content:'';display:block;width:4px;height:16px;background:linear-gradient(180deg,var(--y2),var(--org));border-radius:2px;}

/* CAT TABS */
.cat-tabs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:13px;}
.cat-tabs::-webkit-scrollbar{display:none;}
.cat-tab{flex-shrink:0;padding:6px 13px;border-radius:20px;border:1.5px solid var(--border2);background:var(--white);color:var(--muted);font-size:0.77em;font-weight:700;cursor:pointer;transition:all .14s;white-space:nowrap;font-family:var(--fn);}
.cat-tab.active{background:var(--y);border-color:var(--y2);color:#111;}
.cat-tab:not(.active):hover{border-color:var(--y2);color:var(--text);}

/* ══ CALCULADORA ══ */
.calc-input-card{background:var(--white);border:1px solid var(--border);border-radius:13px;padding:15px;margin-bottom:13px;}
.calc-lbl{font-size:0.68em;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:7px;display:block;}
.valor-row{display:flex;gap:7px;align-items:stretch;}
.val-prefix{background:linear-gradient(135deg,var(--y),var(--org));color:#111;font-weight:900;font-size:1em;padding:0 13px;border-radius:8px;display:flex;align-items:center;flex-shrink:0;}
.val-input{flex:1;background:var(--bg);border:2px solid var(--border2);border-radius:8px;padding:11px 12px;font-family:var(--fn);font-size:1.35em;font-weight:900;color:var(--text);outline:none;transition:border-color .17s;min-width:0;}
.val-input:focus{border-color:var(--y2);}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:5px;margin-top:10px;max-height:185px;overflow-y:auto;}
.prod-btn{background:var(--bg);border:1.5px solid var(--border2);border-radius:8px;padding:8px 9px;cursor:pointer;text-align:left;transition:all .12s;font-family:var(--fn);}
.prod-btn.sel,.prod-btn:active{border-color:var(--y2);background:var(--ydim);}
.pnome{font-size:0.74em;font-weight:700;color:var(--text2);display:block;line-height:1.3;margin-bottom:2px;}
.ppreco{font-size:0.84em;font-weight:900;color:var(--y2);}

/* RESULTADO CALCULADORA */
.result-card{background:var(--white);border:1px solid var(--border2);border-radius:13px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.08);}
.rc-header{background:#1A1915;padding:13px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.rc-brand{font-size:0.61em;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--y);opacity:.7;}
.rc-name{font-size:0.88em;font-weight:800;color:#fff;margin-top:2px;}
.rc-recebe .rl{font-size:0.61em;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:1px;}
.rc-recebe .rv{font-size:1.15em;font-weight:900;color:var(--y);}
.rc-sub{background:linear-gradient(90deg,var(--y),var(--org));padding:7px 15px;font-size:0.74em;font-weight:900;color:#111;text-transform:uppercase;letter-spacing:.5px;}
.calc-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.calc-table{width:100%;border-collapse:collapse;min-width:340px;}
.calc-table thead tr{background:#1A1915;}
.calc-table thead th{padding:7px 10px;font-size:0.64em;font-weight:800;text-transform:uppercase;letter-spacing:.9px;color:var(--y);text-align:right;white-space:nowrap;}
.calc-table thead th:first-child{text-align:center;}
.calc-table thead th:last-child{text-align:center;width:36px;}
.calc-table tbody tr{border-bottom:1px solid var(--border);}
.calc-table tbody tr:nth-child(odd){background:#FFFBE8;}
.calc-table tbody tr.dest{background:#1A1915;}
.calc-table tbody tr:last-child{border-bottom:none;}
.calc-table tbody td{padding:8px 10px;text-align:right;font-size:0.84em;font-weight:600;color:var(--text2);}
.calc-table tbody tr.dest td{color:var(--y);font-weight:700;}
.calc-table tbody td:first-child{text-align:center;font-size:0.8em;font-weight:900;color:var(--text);}
.calc-table tbody tr.dest td:first-child{color:var(--y);}
.calc-table tbody td:last-child{text-align:center;}
.tv-c{font-weight:900;color:var(--text);}
.calc-table tbody tr.dest .tv-c{color:var(--y);}
.tv-p{color:var(--text2);}
.tv-l{font-size:0.77em;opacity:.6;}
.rc-footer{background:#1A1915;padding:6px 14px;text-align:center;font-size:0.61em;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#555;}
.rc-footer b{color:var(--y);}
.empty-calc{text-align:center;padding:26px 18px;color:var(--muted);font-size:0.86em;font-weight:600;}
.share-btn{background:transparent;border:none;cursor:pointer;padding:3px 5px;border-radius:4px;color:var(--muted);font-size:11px;transition:all .11s;}
.share-btn:hover{background:var(--ydim);color:var(--y2);}
/* Checkbox de parcelas escolhidas p/ mensagem ao cliente */
.calc-table thead th:last-child{width:58px;}
.row-actions{display:flex;align-items:center;justify-content:center;gap:5px;}
.parc-check{width:15px;height:15px;accent-color:var(--y);cursor:pointer;margin:0;flex-shrink:0;}

/* ══ TABELA DE PREÇOS + ESTOQUE ══ */
.tbl-section{margin-bottom:12px;}
.tbl-sec-hd{background:linear-gradient(90deg,rgba(255,200,0,0.1),rgba(255,120,0,0.05));border:1px solid rgba(255,200,0,0.2);border-radius:9px 9px 0 0;padding:9px 13px;font-size:0.7em;font-weight:900;text-transform:uppercase;letter-spacing:1.5px;color:var(--text);display:flex;align-items:center;gap:7px;}
.tbl-sec-hd::before{content:'';display:block;width:3px;height:10px;background:linear-gradient(180deg,var(--y2),var(--org));border-radius:2px;}
.tbl-outer{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-top:none;border-radius:0 0 9px 9px;background:var(--white);}
.tbl-main{width:100%;border-collapse:collapse;min-width:0;}
.tbl-main thead tr{background:#F5F3EC;}
.tbl-main thead th{padding:7px 10px;text-align:center;font-size:0.66em;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);white-space:nowrap;}
.tbl-main thead th:first-child{text-align:left;min-width:100px;position:sticky;left:0;background:#F5F3EC;z-index:2;}
.tbl-main tbody tr{border-bottom:1px solid var(--border);}
.tbl-main tbody tr:last-child{border-bottom:none;}
.tbl-main tbody tr:hover{background:rgba(255,214,0,0.04);}
.tbl-main tbody td{padding:9px 10px;text-align:center;color:var(--text2);font-size:0.83em;font-weight:600;white-space:nowrap;}
.tbl-main tbody td:first-child{text-align:left;font-weight:700;color:var(--text);position:sticky;left:0;background:var(--white);z-index:1;}
.tbl-main tbody tr:hover td:first-child{background:rgba(255,250,220,0.9);}
.p-avista{font-weight:900;color:var(--green)!important;white-space:nowrap;}
.p-parc .pv{font-weight:700;color:var(--text);}
.p-parc .pm{font-size:0.76em;color:var(--muted);display:block;}
.p-min{color:var(--purple)!important;font-weight:800!important;}
.p-qtde{font-weight:800;}
.p-qtde.q0{color:var(--red)!important;}
.p-qtde.qfew{color:var(--orange)!important;}
.p-qtde.qok{color:var(--green)!important;}
.p-custo{color:var(--text2)!important;font-weight:700;white-space:nowrap;}
.p-est{line-height:1.5;}
.p-est.q0{color:var(--red);}
.p-est.qfew{color:var(--orange);}
.p-est.qok{color:var(--green);}
.p-est-total{font-weight:900;font-size:0.95em;margin-top:2px;color:var(--text);}
.cores-mini{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;font-size:0.7em;font-weight:600;color:var(--text2);}
.calc-btn{background:var(--ydim);border:1px solid rgba(255,200,0,0.3);color:var(--y2);border-radius:5px;padding:3px 7px;font-size:0.68em;font-weight:700;cursor:pointer;transition:all .12s;white-space:nowrap;font-family:var(--fn);}
.calc-btn:hover{background:var(--y);color:#111;}
.p-obs{font-size:0.72em;color:var(--orange);font-style:italic;display:block;margin-top:2px;white-space:normal;max-width:100px;}

/* PARC CONFIG */
.parc-config{background:var(--white);border:1px solid var(--border);border-radius:11px;padding:13px 15px;margin-bottom:13px;}
.parc-config-title{font-size:0.72em;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:8px;}
.parc-grid{display:flex;gap:6px;flex-wrap:wrap;}
.parc-chip{padding:5px 11px;border-radius:20px;border:1.5px solid var(--border2);background:var(--bg);color:var(--muted);font-size:0.77em;font-weight:700;cursor:pointer;transition:all .13s;user-select:none;font-family:var(--fn);}
.parc-chip.on{background:var(--y);border-color:var(--y2);color:#111;}

/* ══ FOTOS ══ */
.foto-card{background:var(--white);border:1px solid var(--border);border-radius:11px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:7px;transition:all .14s;}
.foto-card.has{cursor:pointer;border-left:3px solid var(--y2);}
.foto-card.has:hover{border-color:var(--y2);background:var(--ydim);}
.fc-name{font-size:0.87em;font-weight:700;color:var(--text);margin-bottom:2px;}
.fc-cat{font-size:0.66em;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);}
.fc-icon{width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:0.95em;}
.fc-icon.has{background:var(--ydim);}
.fc-icon.no{background:var(--surface);}

/* ══ CRM ══ */
.crm-stats-bar{background:linear-gradient(135deg,rgba(255,200,0,0.08),rgba(255,120,0,0.04));border:1px solid rgba(255,200,0,0.15);border-radius:11px;padding:12px 15px;margin-bottom:12px;display:flex;gap:16px;flex-wrap:wrap;}
.cs-item{text-align:center;}
.cs-val{font-size:1.3em;font-weight:900;line-height:1;}
.cs-lbl{font-size:0.63em;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-top:1px;}
.vend-sel-wrap{display:flex;align-items:center;gap:8px;margin-bottom:11px;flex-wrap:wrap;}
.vend-sel{background:var(--white);border:1.5px solid var(--border2);border-radius:8px;color:var(--text);font-family:var(--fn);font-size:0.84em;font-weight:700;padding:7px 11px;outline:none;cursor:pointer;}
.vend-sel:focus{border-color:var(--y2);}
.metrica-bar{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:12px;position:relative;overflow:hidden;}
.metrica-bar::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--y2),var(--org));}
.mb-nome{font-size:0.88em;font-weight:800;color:var(--text);margin-bottom:7px;}
.mb-vals{display:flex;gap:14px;flex-wrap:wrap;}
.mb-item{text-align:center;}
.mb-num{font-size:1.2em;font-weight:900;line-height:1;}
.mb-lbl{font-size:0.62em;color:var(--muted);font-weight:700;text-transform:uppercase;}
.lead-card{background:var(--white);border:1px solid var(--border);border-radius:11px;overflow:hidden;margin-bottom:8px;transition:border-color .14s;}
.lead-card:hover{border-color:rgba(255,200,0,0.3);}
.lead-top{padding:10px 13px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.lead-nome{font-size:0.9em;font-weight:800;color:var(--text);margin-bottom:2px;}
.lead-fone{font-size:0.74em;color:var(--muted);}
.lead-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;}
.ltag{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:0.67em;font-weight:700;}
.lt-novo{background:var(--bluel);color:var(--blue);}
.lt-neg{background:var(--ydim);color:var(--y2);}
.lt-prop{background:var(--orangel);color:var(--orange);}
.lt-fechado{background:var(--greenl);color:var(--green);}
.lt-perdido{background:var(--redl);color:var(--red);}
.lt-mod{background:rgba(0,0,0,.07);color:var(--text2);}
.lt-vend{background:rgba(0,0,0,.07);color:var(--text2);}
.lead-date{font-size:0.67em;color:var(--muted);white-space:nowrap;flex-shrink:0;}
.lead-body{padding:0 13px 10px;}
.lead-det{font-size:0.78em;color:var(--text2);line-height:1.5;margin-bottom:5px;}
.lead-obj{background:var(--redl);border-left:3px solid var(--red);border-radius:0 5px 5px 0;padding:5px 9px;font-size:0.76em;color:var(--text2);margin-bottom:5px;}
.lead-btns{display:flex;gap:5px;flex-wrap:wrap;}

/* ADMIN */
.admin-login{display:flex;align-items:center;justify-content:center;min-height:58vh;}
.login-box{background:var(--white);border:1px solid var(--border2);border-radius:15px;padding:26px 22px;width:100%;max-width:330px;text-align:center;}
.login-icon{width:48px;height:48px;background:linear-gradient(135deg,var(--y),var(--org));border-radius:11px;margin:0 auto 13px;display:flex;align-items:center;justify-content:center;font-size:1.3em;}
.login-title{font-size:1.05em;font-weight:900;margin-bottom:3px;}
.login-sub{font-size:0.78em;color:var(--muted);margin-bottom:16px;}
.login-input{width:100%;padding:10px 12px;border:1.5px solid var(--border2);border-radius:8px;background:var(--bg);font-family:var(--fn);font-size:0.88em;color:var(--text);outline:none;margin-bottom:7px;}
.login-input:focus{border-color:var(--y2);}
.login-err{font-size:0.74em;color:var(--red);min-height:15px;margin-bottom:5px;}
.admin-tabs{display:flex;gap:4px;margin-bottom:13px;background:var(--surface);border-radius:9px;padding:3px;flex-wrap:wrap;}
.admin-tab{padding:6px 12px;border-radius:7px;border:none;cursor:pointer;font-family:var(--fn);font-weight:700;font-size:0.76em;background:transparent;color:var(--muted);transition:all .14s;}
.admin-tab.active{background:var(--y);color:#111;}
.esec{background:var(--white);border-radius:10px;border:1px solid var(--border);margin-bottom:9px;overflow:hidden;}
.esec-h{background:var(--surface);padding:10px 13px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;}
.esec-h h3{font-size:0.75em;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--text2);}
.esec-h .arr{font-size:10px;color:var(--muted);transition:transform .18s;}
.esec-h.open .arr{transform:rotate(180deg);}
.esec-b{padding:11px;display:none;}
.esec-b.open{display:block;}
.aviso-edit{background:var(--ydim);border:1px solid rgba(255,200,0,0.25);border-radius:9px;padding:10px 13px;margin-bottom:10px;font-size:0.79em;color:var(--text2);line-height:1.65;}
.aviso-edit b{color:var(--y2);}
.cat-row{display:flex;align-items:center;gap:7px;margin-bottom:6px;background:var(--bg);border-radius:7px;padding:8px 10px;border:1px solid var(--border);}
.cat-icon{font-size:13px;flex-shrink:0;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 13px;border-radius:8px;font-family:var(--fn);font-size:0.81em;font-weight:700;cursor:pointer;border:none;transition:all .14s;}
.btn-y{background:var(--y);color:#111;}
.btn-y:hover{background:var(--y2);transform:translateY(-1px);}
.btn-y:disabled{opacity:.6;cursor:default;transform:none;}
.btn-ghost{background:var(--surface);color:var(--text2);border:1px solid var(--border2);}
.btn-ghost:hover{border-color:var(--y2);color:var(--text);}

/* TOAST */

.cad-search:focus{border-color:var(--y2);}
/* EMPTY */

.assist-stock-row:last-child{border-bottom:0}
.assist-stock-name{font-size:.82em;font-weight:900}.assist-stock-sub{font-size:.66em;color:#8793a5;margin-top:2px}
.assist-stock-qty{font-size:1.05em;font-weight:900;text-align:center}.assist-stock-status{font-size:.68em;text-align:right;color:#64748b}
.unit-controls{display:inline-flex;align-items:center;gap:5px;background:#f7f9fc;border:1px solid #e3e8f0;border-radius:10px;padding:3px}
.unit-btn{width:30px;height:30px;border:0;border-radius:8px;background:#fff;font-weight:900;font-size:17px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.unit-btn.plus{background:var(--accent)}.unit-btn.minus{color:#dc2626}
.unit-num{min-width:28px;text-align:center;font-weight:900;font-size:.8em}
@media(max-width:700px){.assist-grid{grid-template-columns:1fr}.assist-hero{align-items:flex-start;flex-direction:column}.assist-stock-row{grid-template-columns:1fr auto}.assist-stock-status{grid-column:1/-1;text-align:left}}

/* LOGO E-PULSE + QUANTO SOBRA */
.brand-logo-wrap{display:flex;align-items:center;background:#fff;border-radius:11px;padding:5px 9px;box-shadow:0 4px 14px rgba(0,0,0,.18);height:40px}.brand-logo-img{display:block;width:132px;max-height:30px;object-fit:contain}.auth-brand-logo{display:block;width:min(220px,78%);height:auto;margin:0 auto 17px}
.net-card{background:linear-gradient(135deg,#0b1424,#142844);border-radius:18px;padding:16px;margin:13px 0;color:#fff;box-shadow:0 10px 30px rgba(12,29,55,.12)}.net-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:13px}.net-card-title{font-size:.95em;font-weight:900}.net-card-sub{font-size:.7em;color:#aebdd1;line-height:1.45;margin-top:3px}.net-grid{display:grid;grid-template-columns:1fr;gap:9px}.net-field label{display:block;font-size:.64em;font-weight:900;text-transform:uppercase;letter-spacing:.7px;color:#9fb0c7;margin-bottom:5px}.net-input{width:100%;border:1.5px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);color:#fff;border-radius:11px;padding:11px 12px;font-family:var(--fn);font-size:.92em;font-weight:800;outline:none}.net-input:focus{border-color:var(--accent)}.net-table-wrap{margin-top:11px;overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid rgba(255,255,255,.09);border-radius:13px}.net-table{width:100%;border-collapse:collapse;min-width:570px}.net-table thead th{background:rgba(255,255,255,.08);padding:9px 10px;font-size:.62em;text-transform:uppercase;letter-spacing:.65px;color:#a7b6ca;text-align:right;white-space:nowrap}.net-table thead th:first-child{text-align:center}.net-table tbody tr{border-top:1px solid rgba(255,255,255,.07)}.net-table tbody tr:nth-child(odd){background:rgba(255,255,255,.025)}.net-table tbody tr.net-dest{background:rgba(255,214,0,.09)}.net-table td{padding:9px 10px;font-size:.78em;text-align:right;color:#e8eef7;white-space:nowrap}.net-table td:first-child{text-align:center;font-weight:900;color:var(--accent)}.net-table .net-liquid{font-weight:900;color:var(--accent)}.net-table .net-fee{color:#cbd5e1}.net-table .net-installment{font-weight:800}.net-empty{text-align:center!important;padding:24px!important;color:#9fb0c7!important}.net-summary{font-size:.67em;color:#a9b8ce;margin-top:9px}.net-summary b{color:#fff}
@media(max-width:580px){.brand-logo-img{width:105px}.brand-logo-wrap{height:36px;padding:4px 7px}.logo-text{display:none}.net-table{min-width:520px}.net-card{padding:14px}}

</style>

function getIgorParcela(item,p){
  const key=String(p);
  if(item?.parcelas && item.parcelas[key]!=null)return Number(item.parcelas[key])||0;
  const legacy=item?.['p'+p];
  return legacy!=null?Number(legacy)||0:0;
}

function setIgorParcela(item,p,v){
  if(!item.parcelas||typeof item.parcelas!=='object')item.parcelas={};
  item.parcelas[String(p)]=Number(v)||0;
}

function normalizeTabelaIgorParcelas(){
  tabelaIgorParcelas=[...new Set((tabelaIgorParcelas||[]).map(Number).filter(p=>Number.isFinite(p)&&p>0))].sort((a,b)=>a-b);
  if(!tabelaIgorParcelas.length)tabelaIgorParcelas=[12,18,21];
  tabelaIgor.forEach(sec=>(sec.items||[]).forEach(item=>{
    tabelaIgorParcelas.forEach(p=>{
      if(item?.parcelas?.[String(p)]==null && item?.['p'+p]!=null)setIgorParcela(item,p,item['p'+p]);
    });
  }));
}

function normModelKey(s){
  return String(s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^A-Z0-9]+/g,' ').replace(/\s+/g,' ').trim();
}

function applyIgorPricesToCalculator(){
  const allIgor=tabelaIgor.flatMap(sec=>sec.items);
  const priceMap=new Map();

  allIgor.forEach(item=>{
    priceMap.set(normModelKey(item.n),item.av);
    (IGOR_PRICE_ALIASES[item.n]||[]).forEach(a=>priceMap.set(normModelKey(a),item.av));
  });

  cats.forEach(cat=>(cat.prods||[]).forEach(prod=>{
    const novo=priceMap.get(normModelKey(prod.n));
    if(novo!=null)prod.v=novo;
  }));

  const targets={'Patinetes':'pt','Bikes Elétricas':'bk','Scooters Elétricas':'sc'};
  tabelaIgor.forEach(sec=>{
    let cat=cats.find(c=>c.id===targets[sec.categoria]);
    if(!cat)return;
    sec.items.forEach(item=>{
      const aliases=[item.n,...(IGOR_PRICE_ALIASES[item.n]||[])].map(normModelKey);
      const exists=cat.prods.some(p=>aliases.includes(normModelKey(p.n)));
      if(!exists)cat.prods.push({n:item.n,v:item.av});
    });
  });
}

async function enterApp(user){

  currentUser=user;
  setAuthStatus('');

  if(activeUid!==user.uid){
    if(unsubCRM){try{unsubCRM();}catch(e){}}

    if(unsubAgenda){try{unsubAgenda();}catch(e){}}

    activeUid=user.uid;

  if(!sharedStarted){

    initShared();
  }

async function loginGoogle(){
  if(loginInProgress)return;
  const btn=document.getElementById('googleLoginBtn');
  loginInProgress=true;
  setAuthStatus('');
  if(btn){btn.disabled=true;btn.innerHTML='G &nbsp; Abrindo Google…';}

  try{
    // Mesmo padrão do Financeiro: popup direto, sem redirect.
    const result=await signInWithPopup(auth,googleProvider);
    if(!result?.user?.uid)throw Object.assign(new Error('Sessão Google inválida.'),{code:'auth/no-user'});
    await result.user.getIdToken(true);
    await enterApp(result.user);
    console.log('E-Pulse Auth OK:',result.user.email,result.user.uid);
  }catch(e){
    console.error('E-Pulse Auth:',e?.code,e?.message,e);
    let msg='Não foi possível entrar com Google.';
    if(e?.code==='auth/popup-blocked')msg='O Safari bloqueou a janela do Google. Permita pop-ups e tente novamente.';
    else if(e?.code==='auth/popup-closed-by-user')msg='A janela do Google foi fechada antes do login terminar.';
    else if(e?.code==='auth/cancelled-popup-request')msg='Outra tentativa de login já estava aberta. Aguarde alguns segundos e tente novamente.';
    else if(e?.code==='auth/unauthorized-domain')msg='Este domínio não está autorizado no Firebase. Adicione carloswesley299-glitch.github.io em Authentication → Domínios autorizados.';
    else if(e?.code==='auth/operation-not-allowed')msg='O provedor Google não está ativado neste projeto Firebase.';
    else if(e?.code==='auth/network-request-failed')msg='Falha de conexão durante o login. Verifique a internet.';
    else if(e?.code==='auth/web-storage-unsupported')msg='O navegador bloqueou o armazenamento necessário ao login.';
    else if(e?.code==='auth/internal-error')msg='O Firebase retornou um erro interno. Confira o provedor Google do projeto calculadora-e-pulse.';
    else if(e?.code)msg+=' Código: '+e.code+'.';
    setAuthStatus(msg);
    toast('Falha no login','❌');
  }finally{
    loginInProgress=false;
    if(btn){btn.disabled=false;btn.innerHTML='G &nbsp; Entrar com Google';}
  }
}

window.logoutApp=async()=>{
  try{

const authGuard=setTimeout(()=>{

onAuthStateChanged(auth,async user=>{
  authReady=true;

  if(user?.uid){

function calcularQuantoSobra(){
  const gross=parseBR(document.getElementById('netGrossInp')?.value||'0');
  const tb=document.getElementById('netTb'),det=document.getElementById('netDetalhe');
  if(!tb)return;
  if(!gross||gross<=0){
    tb.innerHTML='<tr><td colspan="5" class="net-empty">Digite um valor para comparar todas as opções.</td></tr>';
    if(det)det.textContent='Mostra o líquido real depois da taxa para cada número de parcelas.';
    return;
  }
  const dest=[1,6,12,18,21,24];
  tb.innerHTML=taxas.map(({p,j})=>{
    const descontado=gross*(Number(j)/100),sobra=gross-descontado,valorParcela=gross/Number(p);
    return '<tr'+(dest.includes(Number(p))?' class="net-dest"':'')+'><td>'+p+'x</td><td>'+f2(j)+'%</td><td class="net-fee">'+fmt(descontado)+'</td><td class="net-liquid">'+fmt(sobra)+'</td><td class="net-installment">'+fmt(valorParcela)+'</td></tr>';
  }).join('');
  if(det)det.innerHTML='Comparativo completo sobre <b>'+fmt(gross)+'</b> · veja quanto sobra líquido em cada parcelamento.';
}

window.selProd=(n,v,btn)=>{
  nomeCalc=n;

  document.querySelectorAll('.prod-btn').forEach(b=>b.classList.remove('sel'));

function getCalcValores(){
  const total=parseBR(document.getElementById('vInp')?.value||'0');
  let entrada=parseBR(document.getElementById('entradaInp')?.value||'0');
  if(entrada<0)entrada=0;
  if(total>0&&entrada>total)entrada=total;
  return{total,entrada,saldo:Math.max(0,total-entrada)};
}

function calcular(){
  const {total,entrada,saldo}=getCalcValores();
  const tb=document.getElementById('calcTb');if(!tb)return;
  const resumo=document.getElementById('entradaResumo');
  if(!total||total<=0){
    tb.innerHTML='<tr><td colspan="4" class="empty-calc">Digite um valor ↑</td></tr>';
    const rv=document.getElementById('rcVal');if(rv)rv.textContent='R$ —';
    if(resumo)resumo.style.display='none';
    return;
  }
  if(resumo){
    if(entrada>0){
      resumo.style.display='block';
      resumo.innerHTML='Entrada: <b>'+fmt(entrada)+'</b> &nbsp;•&nbsp; Saldo para parcelar: <b>'+fmt(saldo)+'</b>';
    }else resumo.style.display='none';
  }
  document.getElementById('rcVal').textContent=fmt(total);
  document.getElementById('rcNome').textContent=nomeCalc||'Valor personalizado';
  document.getElementById('rcSub').textContent=entrada>0?'Entrada '+fmt(entrada)+' · saldo '+fmt(saldo):'Tabela de Parcelamento';
  const dest=[1,6,12,18,24];
  const marcadas=getParcelasCliente();
  if(saldo<=0){
    tb.innerHTML='<tr><td colspan="4" class="empty-calc">Entrada cobre 100% do valor. Não há saldo para parcelar.</td></tr>';
    return;
  }
  tb.innerHTML=taxas.map(({p,j})=>{
    const c=saldo/(1-j/100),pa=c/p;
    return`<tr${dest.includes(p)?' class="dest"':''}>
      <td>${p}x</td>
      <td class="tv-c">${fmt(c)}</td>
      <td class="tv-p">${fmt(pa)}/mês</td>
      <td><div class="row-actions"><input type="checkbox" class="parc-check" title="Marcar ${p}x para o cliente" ${marcadas.includes(p)?'checked':''} onchange="setParcelaCliente(${p},this.checked)"><button class="share-btn" onclick="compLinha(${p},${c.toFixed(2)},${pa.toFixed(2)})" title="WhatsApp ${p}x">📲</button></div></td>
    </tr>`;
  }).join('');
}

window.compLinha=(p,c,pa)=>{
  const n=nomeCalc||'Veículo elétrico';
  const {total,entrada,saldo}=getCalcValores();
  let txt='🛵 *E-Pulse · '+n+'*\n\n';
  txt+='💰 Valor: *'+fmt(total)+'*\n';
  if(entrada>0)txt+='🔹 Entrada: *'+fmt(entrada)+'*\n💳 Saldo no cartão: *'+fmt(saldo)+'*\n';
  txt+='\n💳 *'+p+'x de '+fmt(pa)+'*\n\n📍 E-Pulse · Criciúma\n_Valores sujeitos a alterações_';
  window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
};

window.compTabela=()=>{
  const {total,entrada,saldo}=getCalcValores();
  if(!total||total<=0){toast('Digite um valor primeiro','⚠️');return;}
  const n=nomeCalc||'Veículo elétrico';
  let txt='🛵 *E-Pulse · Tabela de Parcelamento*\n📌 *'+n+'*\n\n💰 Valor: *'+fmt(total)+'*\n';
  if(entrada>0)txt+='🔹 Entrada: *'+fmt(entrada)+'*\n💳 Saldo a parcelar: *'+fmt(saldo)+'*\n';
  txt+='\n';
  if(saldo<=0){
    txt+='✅ Pagamento integral na entrada.\n';
  }else{
    taxas.forEach(({p,j})=>{
      const c=saldo/(1-j/100),pa=c/p;
      txt+='*'+p+'x* de *'+fmt(pa)+'*\n';
    });
  }
  txt+='\n💳 Forma de pagamento: entrada + cartão de crédito\n📍 E-Pulse · Criciúma e região\n_Valores sujeitos a alterações_';
  window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
};

function gerarParcelasMsg(saldo){
  const marcadas=getParcelasCliente().slice().sort((a,b)=>a-b);
  if(saldo<=0)return'• ✅ Pagamento integral na entrada';
  return marcadas.map(p=>{
    const tx=taxas.find(t=>t.p===p);
    if(!tx)return null;
    const c=saldo/(1-tx.j/100),pa=c/p;
    return'• *'+p+'x* de *'+fmt(pa)+'*';
  }).filter(Boolean).join('\n');
}

function aplicarCamposMsg(template){
  const {total,entrada,saldo}=getCalcValores();
  const modelo=nomeCalc||'Veículo elétrico';
  const parcelas=gerarParcelasMsg(saldo);

  // Mantém o bloco comercial limpo: se não houver entrada, ele desaparece por completo.
  const entradaBloco=entrada>0
    ?'💵 Entrada: *'+fmt(entrada)+'*\n💳 Saldo no cartão: *'+fmt(saldo)+'*\n\n'
    :'';

  return template
    .replace(/{modelo}/g,modelo)
    .replace(/{avista}/g,fmt(total))
    .replace(/{entrada}/g,fmt(entrada))
    .replace(/{saldo}/g,fmt(saldo))
    .replace(/{entrada_bloco}/g,entradaBloco)
    .replace(/{parcelas}/g,parcelas);
}

function validarMsgCliente(){
  const {total,saldo}=getCalcValores();
  if(!total||total<=0){toast('Digite ou selecione um valor primeiro.','⚠️');return false;}
  if(saldo>0&&!getParcelasCliente().length){toast('Marque pelo menos uma parcela.','⚠️');return false;}
  return true;
}

function gerarMsgCliente(){
  return aplicarCamposMsg(getMsgTemplate());
}
function gerarMsgClienteRapida(){
  return aplicarCamposMsg(getMsgTemplateRapida());
}

function copiarTextoSeguro(txt){
  if(navigator.clipboard?.writeText){
    return navigator.clipboard.writeText(txt).then(()=>toast('Mensagem copiada!')).catch(()=>{
      const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');toast('Mensagem copiada!');}catch(e){toast('Erro ao copiar','⚠️');}
      ta.remove();
    });
  }
  const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('Mensagem copiada!');}catch(e){toast('Erro ao copiar','⚠️');}
  ta.remove();
}

window.copiarMsgCliente=()=>{
  if(!validarMsgCliente())return;
  copiarTextoSeguro(gerarMsgCliente());
};

window.copiarMsgClienteRapida=()=>{
  if(!validarMsgCliente())return;
  copiarTextoSeguro(gerarMsgClienteRapida());
};

window.whatsMsgCliente=()=>{
  if(!validarMsgCliente())return;
  window.open('https://wa.me/?text='+encodeURIComponent(gerarMsgCliente()),'_blank','noopener');
};

function getEstItem(nome){
  try{
    const items=estoque.items||[];
    if(!items.length)return null;
    return items.find(it=>{
      const a=(it.nome||'').toLowerCase().trim();
      const b=(nome||'').toLowerCase().trim();
      return a===b||a.includes(b)||b.includes(a);
    })||null;
  }catch(e){return null;}
}

/* Converte formato antigo (cores string + qtde único) OU novo (coresList) numa lista [{cor,qtde}] */
function normCoresList(it){
  if(!it)return[];
  if(Array.isArray(it.coresList))return it.coresList.map(c=>({cor:c.cor||'',qtde:parseInt(c.qtde)||0}));
  if(it.cores){
    const nomes=String(it.cores).split(',').map(s=>s.trim()).filter(Boolean);
    if(nomes.length)return nomes.map((cor,i)=>({cor,qtde:i===0?(parseInt(it.qtde)||0):0}));
  }
  if(it.qtde)return[{cor:'',qtde:parseInt(it.qtde)||0}];
  return[];
}
function totalQtde(it){return normCoresList(it).reduce((s,c)=>s+(c.qtde||0),0);}

window.compTabelaGeral=()=>{
  const secs=precos.secoes||[];
  let txt=`📦 *ESTOQUE E-PULSE*\n📍 Criciúma e região\n${'─'.repeat(22)}\n\n`;
  let temItem=false;
  secs.forEach(sec=>{
    const linhas=(sec.items||[]).map(item=>{
      const est=getEstItem(item.n);
      const total=totalQtde(est);
      if(!est||total<=0)return null;
      const cores=normCoresList(est).filter(c=>c.qtde>0).map(c=>`${c.qtde} ${c.cor||'—'}`).join(', ');
      return`• *${item.n}* — Total: ${total}${cores?` (${cores})`:''}`;
    }).filter(Boolean);
    if(linhas.length){temItem=true;txt+=`*${sec.nome.toUpperCase()}*\n${linhas.join('\n')}\n\n`;}
  });
  if(!temItem){toast('Nenhum item com estoque cadastrado ainda.','⚠️');return;}
  txt+=`_E-Pulse · Veículos Elétricos_`;
  window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
};

function lerAdmIgor(){
  document.querySelectorAll('[data-igor-field]').forEach(inp=>{

    else item[field]=parseBR(inp.value);
  });
  document.querySelectorAll('[data-igor-parcela]').forEach(inp=>{
    const si=+inp.dataset.si,ii=+inp.dataset.ii,p=+inp.dataset.igorParcela;

window.addIgorParcela=()=>{
  lerAdmIgor();
  const raw=prompt('Quantas vezes deseja adicionar? Ex.: 24');
  if(raw===null)return;
  const p=parseInt(String(raw).replace(/\D/g,''),10);
  if(!p||p<1||p>99){toast('Digite uma quantidade válida de parcelas.','⚠️');return;}
  if(tabelaIgorParcelas.includes(p)){toast(p+'x já existe na tabela.','⚠️');return;}
  tabelaIgorParcelas.push(p);
  tabelaIgorParcelas.sort((a,b)=>a-b);
  tabelaIgor.forEach(sec=>(sec.items||[]).forEach(item=>setIgorParcela(item,p,0)));
  renderAdmIgor();
  toast(p+'x adicionado. Preencha os valores e salve.');
};

window.removeIgorParcela=p=>{
  lerAdmIgor();
  p=Number(p);
  if(tabelaIgorParcelas.length<=1){toast('A tabela precisa ter ao menos uma parcela.','⚠️');return;}
  if(!confirm('Remover a coluna '+p+'x da Tabela Igor?'))return;
  tabelaIgorParcelas=tabelaIgorParcelas.filter(x=>x!==p);
  tabelaIgor.forEach(sec=>(sec.items||[]).forEach(item=>{
    if(item.parcelas)delete item.parcelas[String(p)];
    if(Object.prototype.hasOwnProperty.call(item,'p'+p))delete item['p'+p];
  }));
  renderAdmIgor();
};

window.addAdmIgor=si=>{
  lerAdmIgor();
  const novo={n:'Novo modelo',av:0,parcelas:{}};
  tabelaIgorParcelas.forEach(p=>novo.parcelas[String(p)]=0);
  tabelaIgor[si].items.push(novo);
  renderAdmIgor();
};

window.delAdmIgor=(si,ii)=>{
  lerAdmIgor();
  if(!confirm('Remover este modelo da Tabela Igor?'))return;
  tabelaIgor[si].items.splice(ii,1);
  renderAdmIgor();
};

window.resetAdmIgor=()=>{
  if(!confirm('Restaurar os valores iniciais da Tabela Igor?'))return;
  tabelaIgor=JSON.parse(JSON.stringify(TABELA_IGOR_DEFAULT));
  tabelaIgorParcelas=[12,18,21];

window.salvarTabelaIgor=async()=>{

  lerAdmIgor();

  }
};

function estoqueCategoriaPorSecao(secNome=''){
  const s=String(secNome).toLowerCase();
  if(s.includes('patinete'))return'Patinete';
  if(s.includes('bike'))return'Bike Elétrica';
  if(s.includes('scooter'))return'Scooter';
  return'Outro';
}

function syncEstoqueComCatalogo(){
  if(!estoque.items)estoque.items=[];
  const existentes=new Map(
    estoque.items.map((it,i)=>[normModelKey(it.nome),{it,i}])
  );

  (precos.secoes||[]).forEach(sec=>{
    (sec.items||[]).forEach(p=>{
      const nome=p.n||p.nome||'';
      if(!nome)return;
      const key=normModelKey(nome);
      if(!existentes.has(key)){
        const novo={
          nome,
          categoria:estoqueCategoriaPorSecao(sec.nome),
          coresList:[{cor:'Sem cor',qtde:0}],
          custo:0,
          status:'Disponível',
          fotoUrl:'',
          obs:'',
          _catalogo:true
        };
        estoque.items.push(novo);
        existentes.set(key,{it:novo,i:estoque.items.length-1});
      }
    });
  });
}

window.ajustarUnidadeEst=async(i,delta)=>{
  const it=estoque.items?.[i];if(!it)return;
  if(!Array.isArray(it.coresList))it.coresList=normCoresList(it);
  if(!it.coresList.length)it.coresList=[{cor:'Sem cor',qtde:0}];
  if(delta>0){
    it.coresList[0].qtde=(parseInt(it.coresList[0].qtde)||0)+1;
  }else{
    let idx=it.coresList.findIndex(c=>(parseInt(c.qtde)||0)>0);
    if(idx<0){toast('Estoque já está zerado','⚠️');return;}
    it.coresList[idx].qtde=Math.max(0,(parseInt(it.coresList[idx].qtde)||0)-1);
  }
  renderAdmEstoque();
  try{await setDoc(dEst,estoque);setSync('ok','Salvo!');}catch(e){console.error(e);toast('Erro ao atualizar unidade','❌');}
};

window.editEst=i=>estModal(estoque.items[i],i);
window.delEst=i=>{
  const it=estoque.items?.[i];if(!it)return;
  if(it._catalogo){
    if(!confirm('Este modelo vem da tabela de preços. Deseja zerar o estoque e limpar os dados dele?'))return;
    estoque.items[i]={
      nome:it.nome,
      categoria:it.categoria||'Outro',
      coresList:[{cor:'Sem cor',qtde:0}],
      custo:0,
      status:'Disponível',
      fotoUrl:'',
      obs:'',
      _catalogo:true
    };
  }else{
    if(!confirm('Remover este item do estoque?'))return;
    estoque.items.splice(i,1);
  }
  renderAdmEstoque();
};
window.saveEst=idx=>{
  const it={
    nome:document.getElementById('ee_n').value.trim(),
    categoria:document.getElementById('ee_c').value,
    coresList:_estCoresDraft.filter(c=>(c.cor&&c.cor.trim())||c.qtde>0).map(c=>({cor:c.cor.trim(),qtde:parseInt(c.qtde)||0})),
    custo:parseBR(document.getElementById('ee_custo').value||'0'),
    status:document.getElementById('ee_s').value,
    fotoUrl:document.getElementById('ee_f').value.trim(),
    obs:document.getElementById('ee_o').value.trim(),
    _catalogo:idx>=0?!!estoque.items?.[idx]?._catalogo:false
  };
  if(!it.nome){toast('Digite o nome','⚠️');return;}
  if(!estoque.items)estoque.items=[];
  if(idx===-1)estoque.items.push(it);else estoque.items[idx]=it;

};

  <button class="btn-salvar" style="margin-top:11px;" onclick="salvarVends()">☁️ Salvar</button>`;
}
function vendModal(vend,idx){openModal(`<div class="modal-hd"><div class="modal-title">${idx===-1?'Novo Vendedor':'Editar Vendedor'}</div><button class="modal-close" onclick="closeModal()">✕</button></div><div style="margin-bottom:9px;"><label class="ef-lbl">Nome *</label><input class="ef-inp" id="vn_n" value="${esc(vend.nome||'')}" placeholder="Nome completo" style="width:100%"></div><div style="margin-bottom:14px;"><label class="ef-lbl">Apelido</label><input class="ef-inp" id="vn_a" value="${esc(vend.apelido||'')}" placeholder="Ex: Carol, Igor, Paiolon" style="width:100%"></div><div style="display:flex;gap:7px;"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-y" onclick="saveVend(${idx})">💾 Salvar</button></div>`);}
window.novoVend=()=>vendModal({},-1);
window.editVend=i=>vendModal(crm.vendedores[i],i);
window.delVend=i=>{if(!confirm('Remover?'))return;crm.vendedores.splice(i,1);renderAdmVend();};
window.saveVend=idx=>{const it={nome:document.getElementById('vn_n').value.trim(),apelido:document.getElementById('vn_a').value.trim(),id:idx===-1?('v'+Date.now()):(crm.vendedores[idx]?.id||'v'+Date.now())};if(!it.nome){toast('Digite o nome','⚠️');return;}if(!crm.vendedores)crm.vendedores=[];if(idx===-1)crm.vendedores.push(it);else crm.vendedores[idx]=it;closeModal();renderAdmVend();};
window.salvarVends=async()=>await saveFB(dCRM,crm,'Vendedores');

/* ══ MODAL ══ */
function openModal(html){const bg=document.createElement('div');bg.className='modal-bg';bg.id='modBg';bg.innerHTML=`<div class="modal-box">${html}</div>`;document.getElementById('modals').appendChild(bg);}
window.closeModal=()=>{const b=document.getElementById('modBg');if(b)b.remove();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

/* ══ START ══ */
// A inicialização ocorre após o Firebase Authentication confirmar o usuário.
</script>
